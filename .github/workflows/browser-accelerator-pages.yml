name: browser accelerator Pages

on:
  workflow_run:
    workflows:
      - A-Circuit web 80386 interactive lab
    types: [completed]
  workflow_dispatch:
    inputs:
      acceptance_run_id:
        description: Successful main web-lab run id to deploy
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: browser-accelerator-pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.accepted.outputs.source_sha }}
      acceptance_run_id: ${{ steps.accepted.outputs.run_id }}
    steps:
      - name: Resolve exact accepted web-lab run
        id: accepted
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_RUN_ID: ${{ inputs.acceptance_run_id }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            run_id="${TRIGGER_RUN_ID}"
            source_sha="${TRIGGER_SOURCE_SHA}"
          else
            run_id="${MANUAL_RUN_ID}"
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            test "$(jq -r '.name' <<<"${run_json}")" = "A-Circuit web 80386 interactive lab"
            test "$(jq -r '.conclusion' <<<"${run_json}")" = "success"
            test "$(jq -r '.head_branch' <<<"${run_json}")" = "main"
            source_sha="$(jq -r '.head_sha' <<<"${run_json}")"
          fi
          [[ "${run_id}" =~ ^[0-9]+$ ]]
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "ACCEPTED_RUN_ID=${run_id}" >> "${GITHUB_ENV}"
          echo "ACCEPTED_SOURCE_SHA=${source_sha}" >> "${GITHUB_ENV}"

      - name: Checkout exact accepted source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.accepted.outputs.source_sha }}

      - name: Download exact accepted browser payload
        uses: actions/download-artifact@v5
        with:
          name: accepted-browser-lab-payload
          path: /tmp/accepted-browser-payload
          github-token: ${{ github.token }}
          run-id: ${{ steps.accepted.outputs.run_id }}

      - name: Verify accepted payload provenance
        run: |
          set -euo pipefail
          payload="/tmp/accepted-browser-payload"
          test -s "${payload}/amemory_a_circuit.wasm"
          test -s "${payload}/amemory_browser_probe.wasm"
          test -s "${payload}/web-lab-acceptance-report.json"
          test "$(cat "${payload}/VERSION")" = "$(cat VERSION)"

          jq -e --arg sha "${ACCEPTED_SOURCE_SHA}" --arg version "$(cat VERSION)" '
            .sourceSha == $sha
            and .version == $version
            and .proofCoveredOpcodes == .registryBlocks
            and .proofCoveredOpcodes >= 24
          ' "${payload}/web-lab-acceptance-report.json" >/dev/null

          expected_wasm_sha="$(jq -r '.wasmSha256' "${payload}/web-lab-acceptance-report.json")"
          actual_wasm_sha="$(sha256sum "${payload}/amemory_a_circuit.wasm" | awk '{print $1}')"
          test "${actual_wasm_sha}" = "${expected_wasm_sha}"

      - name: Assemble static Pages artifact
        run: |
          mkdir -p _site
          cp -R experiments/browser-accelerator/web/. _site/
          cp /tmp/accepted-browser-payload/amemory_browser_probe.wasm \
            _site/amemory_browser_probe.wasm
          cp /tmp/accepted-browser-payload/amemory_a_circuit.wasm \
            _site/amemory_a_circuit.wasm
          cp /tmp/accepted-browser-payload/web-lab-acceptance-report.json \
            _site/exact-evidence.json
          cp VERSION _site/VERSION
          cp /tmp/accepted-browser-payload/mts-visual-lock.json _site/mts-visual-lock.json
          mkdir -p _site/vendor/mts-visual
          cp -R /tmp/accepted-browser-payload/vendor/mts-visual/. _site/vendor/mts-visual/
          mkdir -p _site/vendor/three/addons
          cp /tmp/accepted-browser-payload/vendor/three/three.module.js _site/vendor/three/three.module.js
          cp -R /tmp/accepted-browser-payload/vendor/three/addons/. _site/vendor/three/addons/
          cp /tmp/accepted-browser-payload/vendor/mts-visual-core.bundle.js _site/vendor/mts-visual-core.bundle.js
          cp /tmp/accepted-browser-payload/vendor/mts-visual-three.bundle.js _site/vendor/mts-visual-three.bundle.js
          touch _site/.nojekyll

      - name: Generate browser lab build identity
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os
          import re

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          if not version:
              raise SystemExit("browser lab VERSION is empty")

          main_sha = os.environ["ACCEPTED_SOURCE_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", main_sha) is None:
              raise SystemExit(f"Invalid main SHA: {main_sha}")

          info = {
              "schemaVersion": 2,
              "version": version,
              "mainSha": main_sha,
              "acceptanceRunId": int(os.environ["ACCEPTED_RUN_ID"]),
              "builtAt": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
          }
          Path("_site/build-info.json").write_text(json.dumps(info, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(info, indent=2))
          PY
      - name: Generate complete workflow matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pulls_json="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${ACCEPTED_SOURCE_SHA}/pulls?per_page=20")"

          pr_number="$(jq -r \
            'map(select(.merged_at != null)) | sort_by(.merged_at) | last | .number // empty' \
            <<<"${pulls_json}")"
          source_sha="${ACCEPTED_SOURCE_SHA}"
          if [[ -n "${pr_number}" ]]; then
            source_kind="merged_pr_main"
          else
            source_kind="main"
          fi

          workflows_json="$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            | jq -s '[
                .[] | .workflows[]
                | select(.state == "active")
                | select(.path != ".github/workflows/browser-accelerator-pages.yml")
              ] | sort_by(.name)')"

          rows_file="$(mktemp)"
          : > "${rows_file}"

          while IFS= read -r workflow; do
            workflow_id="$(jq -r '.id' <<<"${workflow}")"

            latest_json="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?branch=main&per_page=1")"

            if [[ "$(jq -r '.workflow_runs | length' <<<"${latest_json}")" == "0" ]]; then
              latest_json="$(gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=1")"
            fi

            jq -cn \
              --argjson workflow "${workflow}" \
              --argjson latest "${latest_json}" \
              --arg source_sha "${source_sha}" \
              '{
                id: $workflow.id,
                name: $workflow.name,
                path: $workflow.path,
                state: $workflow.state,
                run: (
                  if ($latest.workflow_runs | length) == 0 then null
                  else ($latest.workflow_runs[0] | {
                    id,
                    status,
                    conclusion,
                    event,
                    headBranch: .head_branch,
                    headSha: .head_sha,
                    url: .html_url,
                    createdAt: .created_at,
                    updatedAt: .updated_at,
                    exactSource: (.head_sha == $source_sha)
                  })
                  end
                )
              }' >> "${rows_file}"
          done < <(jq -c '.[]' <<<"${workflows_json}")

          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -s \
            --arg generated_at "${generated_at}" \
            --arg main_sha "${ACCEPTED_SOURCE_SHA}" \
            --arg source_sha "${source_sha}" \
            --arg source_kind "${source_kind}" \
            --arg pr_number "${pr_number}" \
            '{
              schemaVersion: 2,
              generatedAt: $generated_at,
              mainSha: $main_sha,
              sourceSha: $source_sha,
              source: {
                kind: $source_kind,
                prNumber: (if $pr_number == "" then null else ($pr_number | tonumber) end)
              },
              workflows: .
            }' "${rows_file}" > _site/ci-results.json

          jq -e '
            .schemaVersion == 2
            and (.workflows | type == "array")
            and ([.workflows[].path] | index(".github/workflows/browser-accelerator-pages.yml") | not)
          ' _site/ci-results.json >/dev/null

      - name: Attach automatic CI matrix to dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("_site/index.html")
          html = path.read_text(encoding="utf-8")
          script = '  <script src="./ci-matrix.js"></script>\n'
          marker = "</body>"

          if script not in html:
              if marker not in html:
                  raise SystemExit("index.html has no </body> marker")
              html = html.replace(marker, script + marker, 1)
              path.write_text(html, encoding="utf-8")

          if "ci-matrix.js" not in path.read_text(encoding="utf-8"):
              raise SystemExit("CI matrix script was not attached")
          PY

      - name: Verify published 80386 lab payload
        run: |
          set -euo pipefail

          test -s _site/i386-lab.js
          test -s _site/i386-lab-view.mjs
          test -s _site/i386-proof-view.mjs
          test -s _site/i386-blocks.json
          test -s _site/amemory_a_circuit.wasm
          test -s _site/mts-visual-lock.json
          test -s _site/vendor/mts-visual/index.js
          test -s _site/vendor/mts-visual/blueprint-svg.js
          test -s _site/vendor/mts-visual/three/index.js
          test -s _site/vendor/three/three.module.js
          test -s _site/vendor/three/addons/controls/OrbitControls.js
          test -s _site/vendor/mts-visual-core.bundle.js
          test -s _site/vendor/mts-visual-three.bundle.js
          grep -F 'import("./vendor/mts-visual-core.bundle.js")' _site/i386-proof-view.mjs
          grep -F 'import("./vendor/mts-visual-three.bundle.js")' _site/i386-proof-view.mjs
          grep -F 'createOctahedralLivePhysics3D' _site/i386-proof-view.mjs
          grep -F 'createOctahedralThreeLiveRenderer' _site/i386-proof-view.mjs
          if grep -Fq 'vendor/mts-visual/three/index.js' _site/i386-proof-view.mjs; then
            echo "published proof renderer still references unbundled 3D entrypoint" >&2
            exit 1
          fi
          cp _site/vendor/mts-visual-core.bundle.js /tmp/pages-mts-visual-core.bundle.mjs
          cp _site/vendor/mts-visual-three.bundle.js /tmp/pages-mts-visual-three.bundle.mjs
          node --input-type=module -e 'import("file:///tmp/pages-mts-visual-core.bundle.mjs").then(m => { if (typeof m.buildBlueprintSvgScene !== "function" || typeof m.createOctahedralLivePhysics3D !== "function" || typeof m.estimateOctahedralPerformance3D !== "function" || typeof m.createMonolithicLinkSpringPhysics3D !== "function" || typeof m.deriveMonolithicNetworkShape3D !== "function") process.exit(1); })'
          node --input-type=module -e 'import("file:///tmp/pages-mts-visual-core.bundle.mjs").then(m => { const network={links:Array.from({length:64},(_,i)=>({key:"L"+i,startKey:"L"+i,endKey:"L"+i}))}; const c=m.createOctahedralLivePhysics3D(network,{aspectRatio:2*Math.SQRT2,stiffness:1,simulationSpeed:1}); const t=c.template,p=c.positions; let minY=Infinity,maxY=-Infinity,minZ=Infinity,maxZ=-Infinity; for(let link=0;link<64;link++){let y=0,z=0;for(const v of t.centerTriangle){const o=(link*t.vertexCount+v)*3;y+=p[o+1];z+=p[o+2];}y/=3;z/=3;minY=Math.min(minY,y);maxY=Math.max(maxY,y);minZ=Math.min(minZ,z);maxZ=Math.max(maxZ,z);} for(const value of p){if(!Number.isFinite(value)) process.exit(1);} if(!(maxY-minY>1e-3 && maxZ-minZ>1e-3)) process.exit(1); })'
          node --input-type=module -e 'import("file:///tmp/pages-mts-visual-three.bundle.mjs").then(m => { if (typeof m.createVisualThreeRenderer !== "function" || typeof m.createOctahedralThreeLiveRenderer !== "function" || typeof m.destroyOctahedralThreeLiveRenderer !== "function") process.exit(1); })'
          grep -F '<script type="importmap">' _site/index.html
          grep -F '"three": "./vendor/three/three.module.js"' _site/index.html
          grep -F '"three/addons/": "./vendor/three/addons/"' _site/index.html
          grep -F '<script type="module" src="./i386-lab.js"></script>' _site/index.html

          cp _site/i386-lab.js /tmp/i386-lab.mjs
          node --check /tmp/i386-lab.mjs
          node --check _site/i386-lab-view.mjs
          node --check _site/i386-proof-view.mjs

          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          info = json.loads(Path("_site/build-info.json").read_text(encoding="utf-8"))
          expected_version = Path("VERSION").read_text(encoding="utf-8").strip()
          expected_sha = os.environ["ACCEPTED_SOURCE_SHA"]

          if info["version"] != expected_version:
              raise SystemExit(f"Pages version mismatch: {info['version']} != {expected_version}")
          if info["mainSha"] != expected_sha:
              raise SystemExit(f"Pages SHA mismatch: {info['mainSha']} != {expected_sha}")

          visual_lock = json.loads(Path("_site/mts-visual-lock.json").read_text(encoding="utf-8"))
          if visual_lock["commit"] != "ccb23ffacb6e534690b1e88b35f3056b93929951":
              raise SystemExit("Pages artifact has wrong mts_visual commit")
          if visual_lock["packageVersion"] != "0.5.0":
              raise SystemExit("Pages artifact has wrong mts_visual package version")

          registry = json.loads(Path("_site/i386-blocks.json").read_text(encoding="utf-8"))
          if len(registry.get("blocks", [])) < 24:
              raise SystemExit("Pages artifact lost 80386 registry blocks")

          evidence = json.loads(Path("_site/exact-evidence.json").read_text(encoding="utf-8"))
          if evidence.get("sourceSha") != expected_sha:
              raise SystemExit("exact evidence source SHA mismatch")
          if evidence.get("version") != expected_version:
              raise SystemExit("exact evidence version mismatch")
          if evidence.get("proofCoveredOpcodes") != len(registry["blocks"]):
              raise SystemExit("exact evidence registry/proof coverage mismatch")

          print(f"Pages exact payload PASS: v{expected_version} @ {expected_sha[:12]} / {len(registry['blocks'])} blocks / mts_visual {visual_lock['commit'][:12]}")
          PY

          # Execute the browser build-identity consumer against the generated
          # schema-v2 metadata. A valid artifact must never render fallback text.
          cp _site/build-info.js /tmp/pages-build-info.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { pathToFileURL } from "node:url";

          const info = JSON.parse(
            fs.readFileSync("_site/build-info.json", "utf8")
          );
          const nodes = new Map([
            ["#amemory-version", { textContent: "", title: "" }],
            ["#browser-lab-sha", { textContent: "", title: "" }],
            ["#amemory-build", { textContent: "", title: "" }],
          ]);
          globalThis.document = {
            querySelector(selector) {
              const node = nodes.get(selector);
              if (!node) throw new Error("unexpected selector " + selector);
              return node;
            },
          };
          globalThis.fetch = async (url, options) => {
            if (url !== "./build-info.json" || options?.cache !== "no-store") {
              throw new Error("unexpected build-info fetch contract");
            }
            return {
              ok: true,
              status: 200,
              async json() {
                return info;
              },
            };
          };

          await import(
            pathToFileURL("/tmp/pages-build-info.mjs").href +
              "?acceptance=" + info.mainSha
          );
          await new Promise((resolve) => setTimeout(resolve, 0));

          const versionText = nodes.get("#amemory-version").textContent;
          const shaText = nodes.get("#browser-lab-sha").textContent;
          if (versionText !== "v" + info.version ||
              shaText !== info.mainSha.slice(0, 12) ||
              /unavailable|unknown/i.test(versionText + " " + shaText)) {
            throw new Error(
              "browser build badge did not consume generated build-info.json"
            );
          }
          console.log(
            "Pages build-info consumer PASS: " +
              versionText + " @ " + shaText
          );
          NODE

      - name: Cache-bust interactive lab modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          sha = os.environ["ACCEPTED_SOURCE_SHA"]
          index = Path("_site/index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace(
              'src="./i386-lab.js"',
              f'src="./i386-lab.js?v={sha}"',
          )
          index.write_text(html, encoding="utf-8")

          lab = Path("_site/i386-lab.js")
          source = lab.read_text(encoding="utf-8")
          source = source.replace(
              'from "./i386-lab-view.mjs"',
              f'from "./i386-lab-view.mjs?v={sha}"',
          )
          source = source.replace(
              'from "./i386-proof-view.mjs"',
              f'from "./i386-proof-view.mjs?v={sha}"',
          )
          lab.write_text(source, encoding="utf-8")

          proof = Path("_site/i386-proof-view.mjs")
          proof_source = proof.read_text(encoding="utf-8")
          proof_source = proof_source.replace(
              'from "./i386-lab-view.mjs"',
              f'from "./i386-lab-view.mjs?v={sha}"',
          )
          visual_commit = json.loads(Path("_site/mts-visual-lock.json").read_text(encoding="utf-8"))["commit"]
          proof_source = proof_source.replace(
              'import("./vendor/mts-visual-core.bundle.js")',
              f'import("./vendor/mts-visual-core.bundle.js?v={visual_commit}")',
          )
          proof_source = proof_source.replace(
              'import("./vendor/mts-visual-three.bundle.js")',
              f'import("./vendor/mts-visual-three.bundle.js?v={visual_commit}")',
          )
          proof.write_text(proof_source, encoding="utf-8")

          if 'vendor/mts-visual/three/index.js' in proof_source:
              raise SystemExit("cache-busted proof renderer still references legacy 3D module graph")
          if f'mts-visual-three.bundle.js?v={visual_commit}' not in proof_source:
              raise SystemExit("3D visual bundle cache-bust was not applied")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed proof visualization entrypoints
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail

          base="${PAGE_URL%/}/"
          mkdir -p /tmp/pages-live-smoke

          fetch() {
            local path="$1"
            local target="$2"
            curl               --fail --location --silent --show-error               --retry 12 --retry-delay 5 --retry-all-errors               -H 'Cache-Control: no-cache'               "${base}${path}?smoke=${EXPECTED_SOURCE_SHA}"               -o "${target}"
            test -s "${target}"
          }

          fetch "build-info.json" /tmp/pages-live-smoke/build-info.json
          fetch "exact-evidence.json" /tmp/pages-live-smoke/exact-evidence.json
          fetch "i386-proof-view.mjs" /tmp/pages-live-smoke/i386-proof-view.mjs
          fetch "vendor/mts-visual-core.bundle.js" /tmp/pages-live-smoke/mts-visual-core.bundle.js
          fetch "vendor/mts-visual-three.bundle.js" /tmp/pages-live-smoke/mts-visual-three.bundle.js

          jq -e --arg sha "${EXPECTED_SOURCE_SHA}" '.mainSha == $sha'             /tmp/pages-live-smoke/build-info.json >/dev/null
          jq -e --arg sha "${EXPECTED_SOURCE_SHA}" '
            .sourceSha == $sha
            and .proofCoveredOpcodes == .registryBlocks
            and .proofCoveredOpcodes >= 24
          ' /tmp/pages-live-smoke/exact-evidence.json >/dev/null
          build_version="$(jq -r '.version' /tmp/pages-live-smoke/build-info.json)"
          evidence_version="$(jq -r '.version' /tmp/pages-live-smoke/exact-evidence.json)"
          test -n "${build_version}"
          test "${build_version}" = "${evidence_version}"
          grep -F 'mts-visual-core.bundle.js' /tmp/pages-live-smoke/i386-proof-view.mjs
          grep -F 'mts-visual-three.bundle.js' /tmp/pages-live-smoke/i386-proof-view.mjs
          grep -F 'createOctahedralLivePhysics3D' /tmp/pages-live-smoke/i386-proof-view.mjs
          grep -F 'createOctahedralThreeLiveRenderer' /tmp/pages-live-smoke/i386-proof-view.mjs

          cp /tmp/pages-live-smoke/mts-visual-core.bundle.js /tmp/pages-live-smoke/mts-visual-core.bundle.mjs
          cp /tmp/pages-live-smoke/mts-visual-three.bundle.js /tmp/pages-live-smoke/mts-visual-three.bundle.mjs
          node --input-type=module -e 'import("file:///tmp/pages-live-smoke/mts-visual-core.bundle.mjs").then(m => { if (typeof m.buildBlueprintSvgScene !== "function" || typeof m.createOctahedralLivePhysics3D !== "function" || typeof m.estimateOctahedralPerformance3D !== "function" || typeof m.createMonolithicLinkSpringPhysics3D !== "function" || typeof m.deriveMonolithicNetworkShape3D !== "function") process.exit(1); })'
          node --input-type=module -e 'import("file:///tmp/pages-live-smoke/mts-visual-core.bundle.mjs").then(m => { const network={links:Array.from({length:64},(_,i)=>({key:"L"+i,startKey:"L"+i,endKey:"L"+i}))}; const c=m.createOctahedralLivePhysics3D(network,{aspectRatio:2*Math.SQRT2,stiffness:1,simulationSpeed:1}); const t=c.template,p=c.positions; let minY=Infinity,maxY=-Infinity,minZ=Infinity,maxZ=-Infinity; for(let link=0;link<64;link++){let y=0,z=0;for(const v of t.centerTriangle){const o=(link*t.vertexCount+v)*3;y+=p[o+1];z+=p[o+2];}y/=3;z/=3;minY=Math.min(minY,y);maxY=Math.max(maxY,y);minZ=Math.min(minZ,z);maxZ=Math.max(maxZ,z);} for(const value of p){if(!Number.isFinite(value)) process.exit(1);} if(!(maxY-minY>1e-3 && maxZ-minZ>1e-3)) process.exit(1); })'
          node --input-type=module -e 'import("file:///tmp/pages-live-smoke/mts-visual-three.bundle.mjs").then(m => { if (typeof m.createVisualThreeRenderer !== "function" || typeof m.createOctahedralThreeLiveRenderer !== "function" || typeof m.destroyOctahedralThreeLiveRenderer !== "function") process.exit(1); })'

          echo "Live Pages proof visualization entrypoints PASS: ${base}"

