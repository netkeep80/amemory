name: browser accelerator Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: browser-accelerator-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add --toolchain 1.98.1 wasm32-unknown-unknown

      - name: Build Rust WASM probe
        run: |
          cargo +1.98.1 build \
            --manifest-path experiments/browser-accelerator/rust/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release

      - name: Build real A-Circuit 80386 lab WASM
        run: |
          cargo +1.98.1 build \
            --manifest-path experiments/a-circuit/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release

      - name: Assemble static Pages artifact
        run: |
          mkdir -p _site
          cp -R experiments/browser-accelerator/web/. _site/
          cp experiments/browser-accelerator/rust/target/wasm32-unknown-unknown/release/amemory_browser_probe.wasm \
            _site/amemory_browser_probe.wasm
          cp experiments/a-circuit/target/wasm32-unknown-unknown/release/amemory_a_circuit.wasm \
            _site/amemory_a_circuit.wasm
          cp VERSION _site/VERSION
          touch _site/.nojekyll

      - name: Generate browser lab build identity
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os
          import re

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          if not version:
              raise SystemExit("browser lab VERSION is empty")

          main_sha = os.environ["GITHUB_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", main_sha) is None:
              raise SystemExit(f"Invalid main SHA: {main_sha}")

          info = {
              "schemaVersion": 1,
              "version": version,
              "mainSha": main_sha,
              "builtAt": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
          }
          Path("_site/build-info.json").write_text(json.dumps(info, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(info, indent=2))
          PY
      - name: Generate complete workflow matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pulls_json="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=20")"

          pr_number="$(jq -r \
            'map(select(.merged_at != null)) | sort_by(.merged_at) | last | .number // empty' \
            <<<"${pulls_json}")"
          source_sha="$(jq -r \
            'map(select(.merged_at != null)) | sort_by(.merged_at) | last | .head.sha // empty' \
            <<<"${pulls_json}")"

          if [[ -n "${source_sha}" ]]; then
            source_kind="merged_pr_head"
          else
            source_kind="main"
            source_sha="${GITHUB_SHA}"
          fi

          workflows_json="$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            | jq -s '[
                .[] | .workflows[]
                | select(.state == "active")
                | select(.path != ".github/workflows/browser-accelerator-pages.yml")
              ] | sort_by(.name)')"

          rows_file="$(mktemp)"
          : > "${rows_file}"

          while IFS= read -r workflow; do
            workflow_id="$(jq -r '.id' <<<"${workflow}")"

            latest_json="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?branch=main&per_page=1")"

            if [[ "$(jq -r '.workflow_runs | length' <<<"${latest_json}")" == "0" ]]; then
              latest_json="$(gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=1")"
            fi

            jq -cn \
              --argjson workflow "${workflow}" \
              --argjson latest "${latest_json}" \
              '{
                id: $workflow.id,
                name: $workflow.name,
                path: $workflow.path,
                state: $workflow.state,
                run: (
                  if ($latest.workflow_runs | length) == 0 then null
                  else ($latest.workflow_runs[0] | {
                    id,
                    status,
                    conclusion,
                    event,
                    headBranch: .head_branch,
                    headSha: .head_sha,
                    url: .html_url,
                    createdAt: .created_at,
                    updatedAt: .updated_at
                  })
                  end
                )
              }' >> "${rows_file}"
          done < <(jq -c '.[]' <<<"${workflows_json}")

          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -s \
            --arg generated_at "${generated_at}" \
            --arg main_sha "${GITHUB_SHA}" \
            --arg source_sha "${source_sha}" \
            --arg source_kind "${source_kind}" \
            --arg pr_number "${pr_number}" \
            '{
              schemaVersion: 2,
              generatedAt: $generated_at,
              mainSha: $main_sha,
              sourceSha: $source_sha,
              source: {
                kind: $source_kind,
                prNumber: (if $pr_number == "" then null else ($pr_number | tonumber) end)
              },
              workflows: .
            }' "${rows_file}" > _site/ci-results.json

          jq -e '
            .schemaVersion == 2
            and (.workflows | type == "array")
            and ([.workflows[].path] | index(".github/workflows/browser-accelerator-pages.yml") | not)
          ' _site/ci-results.json >/dev/null

      - name: Attach automatic CI matrix to dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("_site/index.html")
          html = path.read_text(encoding="utf-8")
          script = '  <script src="./ci-matrix.js"></script>\n'
          marker = "</body>"

          if script not in html:
              if marker not in html:
                  raise SystemExit("index.html has no </body> marker")
              html = html.replace(marker, script + marker, 1)
              path.write_text(html, encoding="utf-8")

          if "ci-matrix.js" not in path.read_text(encoding="utf-8"):
              raise SystemExit("CI matrix script was not attached")
          PY

      - name: Verify published 80386 lab payload
        run: |
          set -euo pipefail

          test -s _site/i386-lab.js
          test -s _site/i386-lab-view.mjs
          test -s _site/i386-blocks.json
          test -s _site/amemory_a_circuit.wasm
          grep -F '<script type="module" src="./i386-lab.js"></script>' _site/index.html

          cp _site/i386-lab.js /tmp/i386-lab.mjs
          node --check /tmp/i386-lab.mjs
          node --check _site/i386-lab-view.mjs

          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          info = json.loads(Path("_site/build-info.json").read_text(encoding="utf-8"))
          expected_version = Path("VERSION").read_text(encoding="utf-8").strip()
          expected_sha = os.environ["GITHUB_SHA"]

          if info["version"] != expected_version:
              raise SystemExit(f"Pages version mismatch: {info['version']} != {expected_version}")
          if info["mainSha"] != expected_sha:
              raise SystemExit(f"Pages SHA mismatch: {info['mainSha']} != {expected_sha}")

          registry = json.loads(Path("_site/i386-blocks.json").read_text(encoding="utf-8"))
          if len(registry.get("blocks", [])) < 24:
              raise SystemExit("Pages artifact lost 80386 registry blocks")

          print(f"Pages 80386 payload PASS: v{expected_version} @ {expected_sha[:12]} / {len(registry['blocks'])} blocks")
          PY

      - name: Cache-bust interactive lab modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          sha = os.environ["GITHUB_SHA"]
          index = Path("_site/index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace(
              'src="./i386-lab.js"',
              f'src="./i386-lab.js?v={sha}"',
          )
          index.write_text(html, encoding="utf-8")

          lab = Path("_site/i386-lab.js")
          source = lab.read_text(encoding="utf-8")
          source = source.replace(
              'from "./i386-lab-view.mjs"',
              f'from "./i386-lab-view.mjs?v={sha}"',
          )
          lab.write_text(source, encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
