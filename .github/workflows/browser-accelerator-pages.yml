name: browser accelerator Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: browser-accelerator-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add --toolchain 1.98.1 wasm32-unknown-unknown

      - name: Build Rust WASM probe
        run: |
          cargo +1.98.1 build \
            --manifest-path experiments/browser-accelerator/rust/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release

      - name: Build real A-Circuit 80386 lab WASM
        run: |
          cargo +1.98.1 build \
            --manifest-path experiments/a-circuit/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release

      - name: Build exact-pinned mts_visual proof renderer
        run: |
          set -euo pipefail
          commit="$(jq -r '.commit' experiments/browser-accelerator/mts-visual.lock.json)"
          test "${commit}" = "4b7c8e97fab8d84a31783a4d8e422dcb12a4e795"

          git clone --quiet https://github.com/netkeep80/mts_visual.git /tmp/mts_visual
          git -C /tmp/mts_visual checkout --quiet "${commit}"
          test "$(git -C /tmp/mts_visual rev-parse HEAD)" = "${commit}"
          npm --prefix /tmp/mts_visual ci --silent
          npm --prefix /tmp/mts_visual run build --silent
          test -s /tmp/mts_visual/dist/src/index.js
          test -s /tmp/mts_visual/dist/src/blueprint-svg.js
          test -s /tmp/mts_visual/dist/src/three/index.js
          test "$(node -p "require('/tmp/mts_visual/node_modules/three/package.json').version")" = "0.185.1"
          test -s /tmp/mts_visual/node_modules/three/build/three.module.js
          test -s /tmp/mts_visual/node_modules/three/examples/jsm/controls/OrbitControls.js

          npx --yes esbuild@0.24.2             /tmp/mts_visual/src/index.ts             --bundle --format=esm --platform=browser --target=es2022             --outfile=/tmp/mts-visual-core.bundle.js
          npx --yes esbuild@0.24.2             /tmp/mts_visual/src/three/index.ts             --bundle --format=esm --platform=browser --target=es2022             --outfile=/tmp/mts-visual-three.bundle.js

          test -s /tmp/mts-visual-core.bundle.js
          test -s /tmp/mts-visual-three.bundle.js

          cp /tmp/mts-visual-core.bundle.js /tmp/mts-visual-core.bundle.mjs
          cp /tmp/mts-visual-three.bundle.js /tmp/mts-visual-three.bundle.mjs
          node --input-type=module -e 'import("file:///tmp/mts-visual-core.bundle.mjs").then(m => { if (typeof m.buildBlueprintSvgScene !== "function") process.exit(1); })'
          node --input-type=module -e 'import("file:///tmp/mts-visual-three.bundle.mjs").then(m => { if (typeof m.createVisualThreeRenderer !== "function" || typeof m.createVisualThreeLiveRenderer !== "function") process.exit(1); })'

      - name: Assemble static Pages artifact
        run: |
          mkdir -p _site
          cp -R experiments/browser-accelerator/web/. _site/
          cp experiments/browser-accelerator/rust/target/wasm32-unknown-unknown/release/amemory_browser_probe.wasm \
            _site/amemory_browser_probe.wasm
          cp experiments/a-circuit/target/wasm32-unknown-unknown/release/amemory_a_circuit.wasm \
            _site/amemory_a_circuit.wasm
          cp VERSION _site/VERSION
          cp experiments/browser-accelerator/mts-visual.lock.json _site/mts-visual-lock.json
          mkdir -p _site/vendor/mts-visual
          cp -R /tmp/mts_visual/dist/src/. _site/vendor/mts-visual/
          mkdir -p _site/vendor/three/addons
          cp /tmp/mts_visual/node_modules/three/build/three.module.js _site/vendor/three/three.module.js
          cp -R /tmp/mts_visual/node_modules/three/examples/jsm/. _site/vendor/three/addons/
          cp /tmp/mts-visual-core.bundle.js _site/vendor/mts-visual-core.bundle.js
          cp /tmp/mts-visual-three.bundle.js _site/vendor/mts-visual-three.bundle.js
          touch _site/.nojekyll

      - name: Generate browser lab build identity
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os
          import re

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          if not version:
              raise SystemExit("browser lab VERSION is empty")

          main_sha = os.environ["GITHUB_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", main_sha) is None:
              raise SystemExit(f"Invalid main SHA: {main_sha}")

          info = {
              "schemaVersion": 1,
              "version": version,
              "mainSha": main_sha,
              "builtAt": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
          }
          Path("_site/build-info.json").write_text(json.dumps(info, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(info, indent=2))
          PY
      - name: Generate complete workflow matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pulls_json="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=20")"

          pr_number="$(jq -r \
            'map(select(.merged_at != null)) | sort_by(.merged_at) | last | .number // empty' \
            <<<"${pulls_json}")"
          source_sha="$(jq -r \
            'map(select(.merged_at != null)) | sort_by(.merged_at) | last | .head.sha // empty' \
            <<<"${pulls_json}")"

          if [[ -n "${source_sha}" ]]; then
            source_kind="merged_pr_head"
          else
            source_kind="main"
            source_sha="${GITHUB_SHA}"
          fi

          workflows_json="$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            | jq -s '[
                .[] | .workflows[]
                | select(.state == "active")
                | select(.path != ".github/workflows/browser-accelerator-pages.yml")
              ] | sort_by(.name)')"

          rows_file="$(mktemp)"
          : > "${rows_file}"

          while IFS= read -r workflow; do
            workflow_id="$(jq -r '.id' <<<"${workflow}")"

            latest_json="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?branch=main&per_page=1")"

            if [[ "$(jq -r '.workflow_runs | length' <<<"${latest_json}")" == "0" ]]; then
              latest_json="$(gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=1")"
            fi

            jq -cn \
              --argjson workflow "${workflow}" \
              --argjson latest "${latest_json}" \
              '{
                id: $workflow.id,
                name: $workflow.name,
                path: $workflow.path,
                state: $workflow.state,
                run: (
                  if ($latest.workflow_runs | length) == 0 then null
                  else ($latest.workflow_runs[0] | {
                    id,
                    status,
                    conclusion,
                    event,
                    headBranch: .head_branch,
                    headSha: .head_sha,
                    url: .html_url,
                    createdAt: .created_at,
                    updatedAt: .updated_at
                  })
                  end
                )
              }' >> "${rows_file}"
          done < <(jq -c '.[]' <<<"${workflows_json}")

          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -s \
            --arg generated_at "${generated_at}" \
            --arg main_sha "${GITHUB_SHA}" \
            --arg source_sha "${source_sha}" \
            --arg source_kind "${source_kind}" \
            --arg pr_number "${pr_number}" \
            '{
              schemaVersion: 2,
              generatedAt: $generated_at,
              mainSha: $main_sha,
              sourceSha: $source_sha,
              source: {
                kind: $source_kind,
                prNumber: (if $pr_number == "" then null else ($pr_number | tonumber) end)
              },
              workflows: .
            }' "${rows_file}" > _site/ci-results.json

          jq -e '
            .schemaVersion == 2
            and (.workflows | type == "array")
            and ([.workflows[].path] | index(".github/workflows/browser-accelerator-pages.yml") | not)
          ' _site/ci-results.json >/dev/null

      - name: Attach automatic CI matrix to dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("_site/index.html")
          html = path.read_text(encoding="utf-8")
          script = '  <script src="./ci-matrix.js"></script>\n'
          marker = "</body>"

          if script not in html:
              if marker not in html:
                  raise SystemExit("index.html has no </body> marker")
              html = html.replace(marker, script + marker, 1)
              path.write_text(html, encoding="utf-8")

          if "ci-matrix.js" not in path.read_text(encoding="utf-8"):
              raise SystemExit("CI matrix script was not attached")
          PY

      - name: Verify published 80386 lab payload
        run: |
          set -euo pipefail

          test -s _site/i386-lab.js
          test -s _site/i386-lab-view.mjs
          test -s _site/i386-proof-view.mjs
          test -s _site/i386-blocks.json
          test -s _site/amemory_a_circuit.wasm
          test -s _site/mts-visual-lock.json
          test -s _site/vendor/mts-visual/index.js
          test -s _site/vendor/mts-visual/blueprint-svg.js
          test -s _site/vendor/mts-visual/three/index.js
          test -s _site/vendor/three/three.module.js
          test -s _site/vendor/three/addons/controls/OrbitControls.js
          test -s _site/vendor/mts-visual-core.bundle.js
          test -s _site/vendor/mts-visual-three.bundle.js
          grep -F 'import("./vendor/mts-visual-core.bundle.js")' _site/i386-proof-view.mjs
          grep -F 'import("./vendor/mts-visual-three.bundle.js")' _site/i386-proof-view.mjs
          if grep -Fq 'vendor/mts-visual/three/index.js' _site/i386-proof-view.mjs; then
            echo "published proof renderer still references unbundled 3D entrypoint" >&2
            exit 1
          fi
          cp _site/vendor/mts-visual-core.bundle.js /tmp/pages-mts-visual-core.bundle.mjs
          cp _site/vendor/mts-visual-three.bundle.js /tmp/pages-mts-visual-three.bundle.mjs
          node --input-type=module -e 'import("file:///tmp/pages-mts-visual-core.bundle.mjs").then(m => { if (typeof m.buildBlueprintSvgScene !== "function") process.exit(1); })'
          node --input-type=module -e 'import("file:///tmp/pages-mts-visual-three.bundle.mjs").then(m => { if (typeof m.createVisualThreeRenderer !== "function" || typeof m.createVisualThreeLiveRenderer !== "function") process.exit(1); })'
          grep -F '<script type="importmap">' _site/index.html
          grep -F '"three": "./vendor/three/three.module.js"' _site/index.html
          grep -F '"three/addons/": "./vendor/three/addons/"' _site/index.html
          grep -F '<script type="module" src="./i386-lab.js"></script>' _site/index.html

          cp _site/i386-lab.js /tmp/i386-lab.mjs
          node --check /tmp/i386-lab.mjs
          node --check _site/i386-lab-view.mjs
          node --check _site/i386-proof-view.mjs

          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          info = json.loads(Path("_site/build-info.json").read_text(encoding="utf-8"))
          expected_version = Path("VERSION").read_text(encoding="utf-8").strip()
          expected_sha = os.environ["GITHUB_SHA"]

          if info["version"] != expected_version:
              raise SystemExit(f"Pages version mismatch: {info['version']} != {expected_version}")
          if info["mainSha"] != expected_sha:
              raise SystemExit(f"Pages SHA mismatch: {info['mainSha']} != {expected_sha}")

          visual_lock = json.loads(Path("_site/mts-visual-lock.json").read_text(encoding="utf-8"))
          if visual_lock["commit"] != "4b7c8e97fab8d84a31783a4d8e422dcb12a4e795":
              raise SystemExit("Pages artifact has wrong mts_visual commit")
          if visual_lock["packageVersion"] != "0.3.0":
              raise SystemExit("Pages artifact has wrong mts_visual package version")

          registry = json.loads(Path("_site/i386-blocks.json").read_text(encoding="utf-8"))
          if len(registry.get("blocks", [])) < 24:
              raise SystemExit("Pages artifact lost 80386 registry blocks")

          print(f"Pages 80386 payload PASS: v{expected_version} @ {expected_sha[:12]} / {len(registry['blocks'])} blocks / mts_visual {visual_lock['commit'][:12]}")
          PY

      - name: Cache-bust interactive lab modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          sha = os.environ["GITHUB_SHA"]
          index = Path("_site/index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace(
              'src="./i386-lab.js"',
              f'src="./i386-lab.js?v={sha}"',
          )
          index.write_text(html, encoding="utf-8")

          lab = Path("_site/i386-lab.js")
          source = lab.read_text(encoding="utf-8")
          source = source.replace(
              'from "./i386-lab-view.mjs"',
              f'from "./i386-lab-view.mjs?v={sha}"',
          )
          source = source.replace(
              'from "./i386-proof-view.mjs"',
              f'from "./i386-proof-view.mjs?v={sha}"',
          )
          lab.write_text(source, encoding="utf-8")

          proof = Path("_site/i386-proof-view.mjs")
          proof_source = proof.read_text(encoding="utf-8")
          proof_source = proof_source.replace(
              'from "./i386-lab-view.mjs"',
              f'from "./i386-lab-view.mjs?v={sha}"',
          )
          visual_commit = json.loads(Path("_site/mts-visual-lock.json").read_text(encoding="utf-8"))["commit"]
          proof_source = proof_source.replace(
              'import("./vendor/mts-visual-core.bundle.js")',
              f'import("./vendor/mts-visual-core.bundle.js?v={visual_commit}")',
          )
          proof_source = proof_source.replace(
              'import("./vendor/mts-visual-three.bundle.js")',
              f'import("./vendor/mts-visual-three.bundle.js?v={visual_commit}")',
          )
          proof.write_text(proof_source, encoding="utf-8")

          if 'vendor/mts-visual/three/index.js' in proof_source:
              raise SystemExit("cache-busted proof renderer still references legacy 3D module graph")
          if f'mts-visual-three.bundle.js?v={visual_commit}' not in proof_source:
              raise SystemExit("3D visual bundle cache-bust was not applied")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed proof visualization entrypoints
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          base="${PAGE_URL%/}/"
          mkdir -p /tmp/pages-live-smoke

          fetch() {
            local path="$1"
            local target="$2"
            curl               --fail --location --silent --show-error               --retry 12 --retry-delay 5 --retry-all-errors               -H 'Cache-Control: no-cache'               "${base}${path}?smoke=${GITHUB_SHA}"               -o "${target}"
            test -s "${target}"
          }

          fetch "build-info.json" /tmp/pages-live-smoke/build-info.json
          fetch "i386-proof-view.mjs" /tmp/pages-live-smoke/i386-proof-view.mjs
          fetch "vendor/mts-visual-core.bundle.js" /tmp/pages-live-smoke/mts-visual-core.bundle.js
          fetch "vendor/mts-visual-three.bundle.js" /tmp/pages-live-smoke/mts-visual-three.bundle.js

          jq -e --arg sha "${GITHUB_SHA}" '.mainSha == $sha'             /tmp/pages-live-smoke/build-info.json >/dev/null
          grep -F 'mts-visual-core.bundle.js' /tmp/pages-live-smoke/i386-proof-view.mjs
          grep -F 'mts-visual-three.bundle.js' /tmp/pages-live-smoke/i386-proof-view.mjs

          cp /tmp/pages-live-smoke/mts-visual-core.bundle.js /tmp/pages-live-smoke/mts-visual-core.bundle.mjs
          cp /tmp/pages-live-smoke/mts-visual-three.bundle.js /tmp/pages-live-smoke/mts-visual-three.bundle.mjs
          node --input-type=module -e 'import("file:///tmp/pages-live-smoke/mts-visual-core.bundle.mjs").then(m => { if (typeof m.buildBlueprintSvgScene !== "function") process.exit(1); })'
          node --input-type=module -e 'import("file:///tmp/pages-live-smoke/mts-visual-three.bundle.mjs").then(m => { if (typeof m.createVisualThreeRenderer !== "function" || typeof m.createVisualThreeLiveRenderer !== "function") process.exit(1); })'

          echo "Live Pages proof visualization entrypoints PASS: ${base}"
