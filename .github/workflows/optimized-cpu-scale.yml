name: A-memory scale and performance

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

concurrency:
  group: amemory-scale-performance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scale:
    name: Scheduled/manual informational scale
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Run scale and performance program
        run: bash scripts/ci-scale-performance.sh
