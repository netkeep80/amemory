                ? (op === 18 ? "function.rotate_carry.rcl" : "function.rotate_carry.rcr")
                : (op === 16 ? "function.rotate.rol" : "function.rotate.ror");
              const selectedKey = carry
                ? "function.rotate_carry.selected"
                : "function.rotate.selected";
