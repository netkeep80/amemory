name: A-Circuit Workbench real-WASM

# The unified Workbench is a first-class executable test surface.

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "experiments/a-circuit/**"
      - "experiments/browser-accelerator/web/**"
      - ".github/workflows/a-circuit-web-lab.yml"
      - ".github/workflows/browser-accelerator-pages.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: a-circuit-web-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add --toolchain 1.98.1 wasm32-unknown-unknown

      - name: Browser lab syntax and rendering witness
        run: |
          set -euo pipefail
          node --check experiments/browser-accelerator/web/workbench.mjs
          node --check experiments/browser-accelerator/web/proof-view.mjs
          node --check experiments/browser-accelerator/web/i386-proof-transport.mjs
          node --check experiments/browser-accelerator/web/i386-wasm-json.mjs
          node --check experiments/browser-accelerator/web/gpu-carrier.mjs
          node --check experiments/browser-accelerator/web/scenario-transport.mjs
          node --check experiments/browser-accelerator/web/scenario-presets.mjs

          node --input-type=module <<'NODE'
          import {
            proofPipelineHtml,
            recursiveStructureHtml,
          } from "./experiments/browser-accelerator/web/proof-view.mjs";

          const collapsed = recursiveStructureHtml("1".repeat(4096));
          if (!collapsed.includes('class="proof-recursive-structure"') ||
              !collapsed.includes("<details") ||
              !collapsed.includes("4096 symbols")) {
            throw new Error("collapsed recursive-structure renderer witness failed");
          }

          const proofFixture = {
            prepare: {
              compilerLabel: "compiler only",
              runtimeMemoryExists: false,
              compiledLinks: 12,
              carrierDuplets: [{ start: 1, end: 1 }, { start: 2, end: 1 }],
              semanticRoots: [
                { role: "function.mux1", source: "98" },
                { role: "execution.interpreter", source: "68" },
                { role: "invocation.call", source: "19868" },
              ],
              theoryAdmissions: ["L8"],
            },
            load: {
              memoryInstanceId: "A-memory#7",
              linksBeforeLoad: 1,
              linksAfterLoad: 12,
              importedDuplets: 2,
              carrierRoundTrip: true,
              semanticRoots: [
                { role: "function.mux1", source: "98", localHandle: 2 },
              ],
            },
            execute: {
              memoryInstanceId: "A-memory#7",
              activeReactionCount: 1,
              finalQuiescent: true,
              reactions: [{
                memoryInstanceId: "A-memory#7",
                step: 0,
                scopeBefore: ["19868"],
                rawRuleMatches: 1,
                transitionedMembers: 1,
                handoffCount: 1,
                scopeAfter: ["16898"],
                linksAfter: 12,
                quiescent: false,
              }],
            },
            result: {
              memoryInstanceId: "A-memory#7",
              resultRecursiveWire: "16898",
              resultSequenceAnum: "98",
              decodedValue: 1,
              oracleValue: 1,
              oracleMatches: true,
              linksFinal: 12,
              identicalRerunLinkDelta: 0,
              visualLinks: [{
                key: "A-memory#7:L1",
                startKey: "A-memory#7:L1",
                endKey: "A-memory#7:L1",
                localHandle: 1,
                label: "ROOT",
                tags: [],
              }],
            },
          };
          const proofHtml = proofPipelineHtml(proofFixture);
          for (const required of [
            "PREPARE ASET",
            "LOAD INTO A-MEMORY",
            "EXECUTE IN THE SAME A-MEMORY",
            "RESULT + VISUALIZATION",
            "Result recursive Link wire",
            "ONE RUNTIME A-MEMORY",
            "A-memory#7",
            "Blueprint 2D",
            "Static 3D",
            "Live physics 3D",
            "@mts/visual 0.5.0",
            "Octahedral Link3D",
            "Structural rules admitted to Theory",
          ]) {
            if (!proofHtml.includes(required)) {
              throw new Error("proof browser renderer missing: " + required);
            }
          }

          console.log("Workbench syntax + collapsed recursive structure + four-stage proof rendering PASS");
          NODE

      - name: Build identity consumer acceptance
        run: |
          set -euo pipefail
          cp experiments/browser-accelerator/web/build-info.js /tmp/amemory-build-info.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { pathToFileURL } from "node:url";

          const version = fs.readFileSync("VERSION", "utf8").trim();
          const info = {
            schemaVersion: 2,
            version,
            mainSha: "a".repeat(40),
            acceptanceRunId: 1,
            builtAt: "2026-01-01T00:00:00Z",
          };
          const nodes = new Map([
            ["#amemory-version", { textContent: "", title: "" }],
            ["#browser-lab-sha", { textContent: "", title: "" }],
            ["#amemory-build", { textContent: "", title: "" }],
          ]);
          globalThis.document = {
            querySelector(selector) {
              const node = nodes.get(selector);
              if (!node) throw new Error("unexpected selector " + selector);
              return node;
            },
          };
          globalThis.fetch = async (url, options) => {
            if (url !== "./build-info.json" || options?.cache !== "no-store") {
              throw new Error("unexpected build-info fetch contract");
            }
            return {
              ok: true,
              status: 200,
              async json() {
                return info;
              },
            };
          };

          await import(
            pathToFileURL("/tmp/amemory-build-info.mjs").href +
              "?acceptance=" + info.mainSha
          );
          await new Promise((resolve) => setTimeout(resolve, 0));

          const versionText = nodes.get("#amemory-version").textContent;
          const shaText = nodes.get("#browser-lab-sha").textContent;
          if (versionText !== "v" + version ||
              shaText !== info.mainSha.slice(0, 12) ||
              /unavailable|unknown/i.test(versionText + " " + shaText)) {
            throw new Error("schema-v2 build identity fell back in browser consumer");
          }
          console.log("schema-v2 build identity consumer PASS");
          NODE

      - name: Native web-lab structural tests
        run: |
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            packed_carrier_reconstructs_complete_shared_topology \
            -- --nocapture --test-threads=1
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            web_lab_executes_real_logic_arithmetic_and_mux_blocks \
            -- --ignored --nocapture --test-threads=1
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            web_lab_rejects_unknown_op_and_invalid_select \
            -- --nocapture --test-threads=1
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            web_mux1_proof_uses_one_runtime_memory_for_all_eight_cases \
            -- --nocapture --test-threads=1

      - name: Verify exact mts_visual proof renderer pin
        run: |
          set -euo pipefail
          commit="$(jq -r '.commit' experiments/browser-accelerator/mts-visual.lock.json)"
          package_version="$(jq -r '.packageVersion' experiments/browser-accelerator/mts-visual.lock.json)"
          test "${commit}" = "ccb23ffacb6e534690b1e88b35f3056b93929951"
          test "${package_version}" = "0.5.0"

          git clone --quiet https://github.com/netkeep80/mts_visual.git /tmp/mts_visual
          git -C /tmp/mts_visual checkout --quiet "${commit}"
          test "$(git -C /tmp/mts_visual rev-parse HEAD)" = "${commit}"
          npm --prefix /tmp/mts_visual ci --silent
          npm --prefix /tmp/mts_visual test --silent
          npm --prefix /tmp/mts_visual run build --silent
          test -s /tmp/mts_visual/dist/src/index.js
          test -s /tmp/mts_visual/dist/src/blueprint-svg.js
          test -s /tmp/mts_visual/dist/src/three/index.js
          test -s /tmp/mts_visual/dist/src/octahedral-live3d.js
          test -s /tmp/mts_visual/dist/src/octahedral-performance3d.js
          test -s /tmp/mts_visual/dist/src/three/octahedral-live-renderer.js
          test "$(node -p "require('/tmp/mts_visual/node_modules/three/package.json').version")" = "0.185.1"
          test -s /tmp/mts_visual/node_modules/three/build/three.module.js
          test -s /tmp/mts_visual/node_modules/three/examples/jsm/controls/OrbitControls.js

          npx --yes esbuild@0.24.2             /tmp/mts_visual/src/index.ts             --bundle --format=esm --platform=browser --target=es2022             --outfile=/tmp/mts-visual-core.bundle.js
          npx --yes esbuild@0.24.2             /tmp/mts_visual/src/three/index.ts             --bundle --format=esm --platform=browser --target=es2022             --outfile=/tmp/mts-visual-three.bundle.js

          test -s /tmp/mts-visual-core.bundle.js
          test -s /tmp/mts-visual-three.bundle.js
          cp /tmp/mts-visual-core.bundle.js /tmp/mts-visual-core.bundle.mjs
          cp /tmp/mts-visual-three.bundle.js /tmp/mts-visual-three.bundle.mjs
          node --input-type=module -e 'import("file:///tmp/mts-visual-core.bundle.mjs").then(m => { if (typeof m.buildBlueprintSvgScene !== "function" || typeof m.createOctahedralLivePhysics3D !== "function" || typeof m.estimateOctahedralPerformance3D !== "function" || typeof m.createMonolithicLinkSpringPhysics3D !== "function" || typeof m.deriveMonolithicNetworkShape3D !== "function") process.exit(1); const e = m.estimateOctahedralPerformance3D(1000000, 2 * Math.SQRT2); if (e.linkCount !== 1000000 || e.pairwiseSemanticLinkEvaluations !== 0 || !Number.isFinite(e.gpuDynamicBytes)) process.exit(1); })'
          node --input-type=module -e 'import("file:///tmp/mts-visual-core.bundle.mjs").then(m => { const network={links:Array.from({length:64},(_,i)=>({key:"L"+i,startKey:"L"+i,endKey:"L"+i}))}; const c=m.createOctahedralLivePhysics3D(network,{aspectRatio:2*Math.SQRT2,stiffness:1,simulationSpeed:1}); const t=c.template,p=c.positions; let minY=Infinity,maxY=-Infinity,minZ=Infinity,maxZ=-Infinity; for(let link=0;link<64;link++){let y=0,z=0;for(const v of t.centerTriangle){const o=(link*t.vertexCount+v)*3;y+=p[o+1];z+=p[o+2];}y/=3;z/=3;minY=Math.min(minY,y);maxY=Math.max(maxY,y);minZ=Math.min(minZ,z);maxZ=Math.max(maxZ,z);} for(const value of p){if(!Number.isFinite(value)) process.exit(1);} if(!(maxY-minY>1e-3 && maxZ-minZ>1e-3)) process.exit(1); })'
          node --input-type=module -e 'import("file:///tmp/mts-visual-three.bundle.mjs").then(m => { if (typeof m.createVisualThreeRenderer !== "function" || typeof m.createOctahedralThreeLiveRenderer !== "function" || typeof m.destroyOctahedralThreeLiveRenderer !== "function") process.exit(1); })'

          grep -F 'import("./vendor/mts-visual-core.bundle.js")' experiments/browser-accelerator/web/proof-view.mjs
          grep -F 'import("./vendor/mts-visual-three.bundle.js")' experiments/browser-accelerator/web/proof-view.mjs
          grep -F 'createOctahedralLivePhysics3D' experiments/browser-accelerator/web/proof-view.mjs
          grep -F 'createOctahedralThreeLiveRenderer' experiments/browser-accelerator/web/proof-view.mjs
          if grep -Fq 'vendor/mts-visual/three/index.js' experiments/browser-accelerator/web/proof-view.mjs; then
            echo "proof renderer still references the fragile unbundled 3D entrypoint" >&2
            exit 1
          fi

      - name: Build the real A-Circuit WASM
        env:
          CARGO_TARGET_DIR: experiments/a-circuit/target
        run: |
          cargo +1.98.1 build \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            --target wasm32-unknown-unknown

      - name: Registry schema and uniqueness
        run: node experiments/a-circuit/tests/web-lab-registry.test.cjs

      - name: Instantiate WASM and verify every registry opcode
        env:
          AMEMORY_SOURCE_SHA: ${{ github.sha }}
        run: |
          node experiments/a-circuit/tests/web-lab-wasm-acceptance.test.cjs
          cat experiments/a-circuit/target/web-lab-acceptance-report.json

      - name: Build browser accelerator WASM for accepted Pages payload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CARGO_TARGET_DIR: experiments/browser-accelerator/rust/target
          RUSTFLAGS: "-C panic=abort"
        run: |
          cargo +1.98.1 build \
            --manifest-path experiments/browser-accelerator/rust/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release

      - name: Stage exact accepted browser payload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          payload="/tmp/accepted-browser-payload"
          rm -rf "${payload}"
          mkdir -p "${payload}/vendor/mts-visual" "${payload}/vendor/three/addons"

          cp experiments/a-circuit/target/wasm32-unknown-unknown/release/amemory_a_circuit.wasm \
            "${payload}/amemory_a_circuit.wasm"
          cp experiments/browser-accelerator/rust/target/wasm32-unknown-unknown/release/amemory_browser_probe.wasm \
            "${payload}/amemory_browser_probe.wasm"
          cp experiments/a-circuit/target/web-lab-acceptance-report.json \
            "${payload}/web-lab-acceptance-report.json"
          cp VERSION "${payload}/VERSION"
          cp experiments/browser-accelerator/mts-visual.lock.json "${payload}/mts-visual-lock.json"

          cp -R /tmp/mts_visual/dist/src/. "${payload}/vendor/mts-visual/"
          cp /tmp/mts_visual/node_modules/three/build/three.module.js \
            "${payload}/vendor/three/three.module.js"
          cp -R /tmp/mts_visual/node_modules/three/examples/jsm/. \
            "${payload}/vendor/three/addons/"
          cp /tmp/mts-visual-core.bundle.js "${payload}/vendor/mts-visual-core.bundle.js"
          cp /tmp/mts-visual-three.bundle.js "${payload}/vendor/mts-visual-three.bundle.js"

          jq -e --arg sha "${GITHUB_SHA}" --arg version "$(cat VERSION)" '
            .sourceSha == $sha
            and .version == $version
            and .proofCoveredOpcodes == .registryBlocks
            and .proofCoveredOpcodes >= 24
          ' "${payload}/web-lab-acceptance-report.json" >/dev/null

      - name: Upload exact accepted browser payload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: accepted-browser-lab-payload
          path: /tmp/accepted-browser-payload
          retention-days: 14
          if-no-files-found: error
