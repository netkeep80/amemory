name: A-Circuit web 80386 interactive lab

# The user-visible constructor is a first-class executable test surface.

on:
  pull_request:
    paths:
      - "experiments/a-circuit/**"
      - "experiments/browser-accelerator/web/**"
      - "VERSION"
      - ".github/workflows/a-circuit-web-lab.yml"
      - ".github/workflows/browser-accelerator-pages.yml"
  push:
    branches: [main]
    paths:
      - "experiments/a-circuit/**"
      - "experiments/browser-accelerator/web/**"
      - "VERSION"
      - ".github/workflows/a-circuit-web-lab.yml"
      - ".github/workflows/browser-accelerator-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add --toolchain 1.98.1 wasm32-unknown-unknown

      - name: Browser lab syntax and rendering witness
        run: |
          set -euo pipefail
          cp experiments/browser-accelerator/web/i386-lab.js /tmp/i386-lab.mjs
          node --check /tmp/i386-lab.mjs
          node --check experiments/browser-accelerator/web/i386-lab-view.mjs
          node --check experiments/browser-accelerator/web/i386-proof-view.mjs

          node --input-type=module <<'NODE'
          import {
            blockDefinitionHtml,
            catalogCardHtml,
            evidenceHtml,
          } from "./experiments/browser-accelerator/web/i386-lab-view.mjs";
          import {
            proofPipelineHtml,
          } from "./experiments/browser-accelerator/web/i386-proof-view.mjs";

          const outcome = {
            value: 0x0a0a0a0a,
            valueHi: 0,
            writeback: 1,
            defined: 0,
            flagValues: 0,
            undefined: 0,
            preserve: 0x000008d5,
            reactions: 42,
            linksBuild: 100,
            linksFirst: 120,
            steadyDelta: 0,
            quiescent: 1,
          };

          const and32 = {
            id: "and32",
            opcode: 1,
            category: "Logic",
            name: "AND32",
            formula: "A & B",
            inputs: [
              { key: "A", slot: "a", type: "word32" },
              { key: "B", slot: "b", type: "word32" },
            ],
            outputs: [{ key: "Result", type: "word32" }],
            modes: ["single", "vectors"],
          };

          const one = evidenceHtml(and32, { A: 0xaaaaaaaa, B: 0x0f0f0f0f }, outcome);
          if (!one.includes("Result") || !one.includes("0x0a0a0a0a") || !one.includes("Identical rerun Link growth")) {
            throw new Error("one-output browser renderer witness failed");
          }

          const mul = {
            id: "mul32-raw",
            opcode: 23,
            category: "Multiply",
            name: "MUL32 raw Wide64",
            formula: "Wide64 = A × B",
            inputs: [
              { key: "A", slot: "a", type: "word32" },
              { key: "B", slot: "b", type: "word32" },
            ],
            outputs: [
              { key: "LoWord32", slot: "value", type: "word32" },
              { key: "HiWord32", slot: "valueHi", type: "word32" },
            ],
            modes: ["single", "vectors"],
          };
          const wide = evidenceHtml(mul, { A: 0xffffffff, B: 2 }, { ...outcome, value: 0xfffffffe, valueHi: 1 });
          if (!wide.includes("LoWord32") || !wide.includes("HiWord32") || !wide.includes("Combined Hi:Lo") || !wide.includes("0x00000001:0xfffffffe")) {
            throw new Error("Wide64 browser renderer witness failed");
          }

          const definition = blockDefinitionHtml(mul);
          const card = catalogCardHtml(mul);
          if (!definition.includes("INPUT ABI") || !definition.includes("OUTPUT ABI") || !card.includes("MUL32 raw Wide64")) {
            throw new Error("constructor definition/catalog renderer witness failed");
          }

          const proofFixture = {
            prepare: {
              compilerLabel: "compiler only",
              runtimeMemoryExists: false,
              compiledLinks: 12,
              carrierDuplets: [{ start: 1, end: 1 }, { start: 2, end: 1 }],
              semanticRoots: [
                { role: "function.mux1", source: "98" },
                { role: "execution.interpreter", source: "68" },
                { role: "invocation.call", source: "19868" },
              ],
              theoryAdmissions: ["L8"],
            },
            load: {
              memoryInstanceId: "A-memory#7",
              linksBeforeLoad: 1,
              linksAfterLoad: 12,
              importedDuplets: 2,
              carrierRoundTrip: true,
              semanticRoots: [
                { role: "function.mux1", source: "98", localHandle: 2 },
              ],
            },
            execute: {
              memoryInstanceId: "A-memory#7",
              activeReactionCount: 1,
              finalQuiescent: true,
              reactions: [{
                memoryInstanceId: "A-memory#7",
                step: 0,
                scopeBefore: ["19868"],
                rawRuleMatches: 1,
                transitionedMembers: 1,
                handoffCount: 1,
                scopeAfter: ["16898"],
                linksAfter: 12,
                quiescent: false,
              }],
            },
            result: {
              memoryInstanceId: "A-memory#7",
              resultAnum: "16898",
              resultSequenceAnum: "98",
              decodedValue: 1,
              oracleValue: 1,
              oracleMatches: true,
              linksFinal: 12,
              identicalRerunLinkDelta: 0,
              visualLinks: [{
                key: "A-memory#7:L1",
                startKey: "A-memory#7:L1",
                endKey: "A-memory#7:L1",
                localHandle: 1,
                anum: "8",
                label: "ROOT",
                tags: [],
              }],
            },
          };
          const proofHtml = proofPipelineHtml(proofFixture);
          for (const required of [
            "PREPARE ASET",
            "LOAD INTO A-MEMORY",
            "EXECUTE IN THE SAME A-MEMORY",
            "RESULT + VISUALIZATION",
            "ONE RUNTIME A-MEMORY",
            "A-memory#7",
            "Blueprint 2D",
            "Static 3D",
            "Live physics 3D",
            "@mts/visual 0.4.1",
            "Octahedral Link3D",
            "Structural rules admitted to Theory",
          ]) {
            if (!proofHtml.includes(required)) {
              throw new Error("proof browser renderer missing: " + required);
            }
          }

          console.log("browser syntax + one-output + Wide64 + four-stage proof rendering PASS");
          NODE

      - name: Native web-lab structural tests
        run: |
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            packed_carrier_reconstructs_complete_shared_topology \
            -- --nocapture --test-threads=1
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            web_lab_executes_real_logic_arithmetic_and_mux_blocks \
            -- --ignored --nocapture --test-threads=1
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            web_lab_rejects_unknown_op_and_invalid_select \
            -- --nocapture --test-threads=1
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            web_mux1_proof_uses_one_runtime_memory_for_all_eight_cases \
            -- --nocapture --test-threads=1

      - name: Verify exact mts_visual proof renderer pin
        run: |
          set -euo pipefail
          commit="$(jq -r '.commit' experiments/browser-accelerator/mts-visual.lock.json)"
          package_version="$(jq -r '.packageVersion' experiments/browser-accelerator/mts-visual.lock.json)"
          test "${commit}" = "57732424778613aca6d865fbb986b64d960042e6"
          test "${package_version}" = "0.4.1"

          git clone --quiet https://github.com/netkeep80/mts_visual.git /tmp/mts_visual
          git -C /tmp/mts_visual checkout --quiet "${commit}"
          test "$(git -C /tmp/mts_visual rev-parse HEAD)" = "${commit}"
          npm --prefix /tmp/mts_visual ci --silent
          npm --prefix /tmp/mts_visual test --silent
          npm --prefix /tmp/mts_visual run build --silent
          test -s /tmp/mts_visual/dist/src/index.js
          test -s /tmp/mts_visual/dist/src/blueprint-svg.js
          test -s /tmp/mts_visual/dist/src/three/index.js
          test -s /tmp/mts_visual/dist/src/octahedral-live3d.js
          test -s /tmp/mts_visual/dist/src/octahedral-performance3d.js
          test -s /tmp/mts_visual/dist/src/three/octahedral-live-renderer.js
          test "$(node -p "require('/tmp/mts_visual/node_modules/three/package.json').version")" = "0.185.1"
          test -s /tmp/mts_visual/node_modules/three/build/three.module.js
          test -s /tmp/mts_visual/node_modules/three/examples/jsm/controls/OrbitControls.js

          npx --yes esbuild@0.24.2             /tmp/mts_visual/src/index.ts             --bundle --format=esm --platform=browser --target=es2022             --outfile=/tmp/mts-visual-core.bundle.js
          npx --yes esbuild@0.24.2             /tmp/mts_visual/src/three/index.ts             --bundle --format=esm --platform=browser --target=es2022             --outfile=/tmp/mts-visual-three.bundle.js

          test -s /tmp/mts-visual-core.bundle.js
          test -s /tmp/mts-visual-three.bundle.js
          cp /tmp/mts-visual-core.bundle.js /tmp/mts-visual-core.bundle.mjs
          cp /tmp/mts-visual-three.bundle.js /tmp/mts-visual-three.bundle.mjs
          node --input-type=module -e 'import("file:///tmp/mts-visual-core.bundle.mjs").then(m => { if (typeof m.buildBlueprintSvgScene !== "function" || typeof m.createOctahedralLivePhysics3D !== "function" || typeof m.estimateOctahedralPerformance3D !== "function") process.exit(1); const e = m.estimateOctahedralPerformance3D(1000000, 2 * Math.SQRT2); if (e.linkCount !== 1000000 || e.pairwiseSemanticLinkEvaluations !== 0 || !Number.isFinite(e.gpuDynamicBytes)) process.exit(1); })'
          node --input-type=module -e 'import("file:///tmp/mts-visual-core.bundle.mjs").then(m => { const network={links:Array.from({length:64},(_,i)=>({key:"L"+i,startKey:"L"+i,endKey:"L"+i}))}; const c=m.createOctahedralLivePhysics3D(network,{aspectRatio:2*Math.SQRT2,stiffness:1,simulationSpeed:1}); const t=c.template,p=c.positions; let minY=Infinity,maxY=-Infinity,minZ=Infinity,maxZ=-Infinity; for(let link=0;link<64;link++){let y=0,z=0;for(const v of t.centerTriangle){const o=(link*t.vertexCount+v)*3;y+=p[o+1];z+=p[o+2];}y/=3;z/=3;minY=Math.min(minY,y);maxY=Math.max(maxY,y);minZ=Math.min(minZ,z);maxZ=Math.max(maxZ,z);} for(const value of p){if(!Number.isFinite(value)) process.exit(1);} if(!(maxY-minY>1e-3 && maxZ-minZ>1e-3)) process.exit(1); })'
          node --input-type=module -e 'import("file:///tmp/mts-visual-three.bundle.mjs").then(m => { if (typeof m.createVisualThreeRenderer !== "function" || typeof m.createOctahedralThreeLiveRenderer !== "function" || typeof m.destroyOctahedralThreeLiveRenderer !== "function") process.exit(1); })'

          grep -F 'import("./vendor/mts-visual-core.bundle.js")' experiments/browser-accelerator/web/i386-proof-view.mjs
          grep -F 'import("./vendor/mts-visual-three.bundle.js")' experiments/browser-accelerator/web/i386-proof-view.mjs
          grep -F 'createOctahedralLivePhysics3D' experiments/browser-accelerator/web/i386-proof-view.mjs
          grep -F 'createOctahedralThreeLiveRenderer' experiments/browser-accelerator/web/i386-proof-view.mjs
          if grep -Fq 'vendor/mts-visual/three/index.js' experiments/browser-accelerator/web/i386-proof-view.mjs; then
            echo "proof renderer still references the fragile unbundled 3D entrypoint" >&2
            exit 1
          fi

      - name: Build the real A-Circuit WASM
        run: |
          cargo +1.98.1 build \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            --target wasm32-unknown-unknown

      - name: Registry schema and uniqueness
        run: |
          node <<'NODE'
          const fs = require("fs");
          const registry = JSON.parse(
            fs.readFileSync("experiments/browser-accelerator/web/i386-blocks.json", "utf8")
          );
          if (registry.schemaVersion !== 1) throw new Error("unexpected registry schema");
          if (!Array.isArray(registry.blocks) || registry.blocks.length < 24) {
            throw new Error("expected at least 24 registered blocks");
          }
          const ids = new Set();
          const opcodes = new Set();
          for (const block of registry.blocks) {
            if (!block.id || !Number.isInteger(block.opcode)) throw new Error("bad block identity");
            if (ids.has(block.id)) throw new Error("duplicate block id " + block.id);
            if (opcodes.has(block.opcode)) throw new Error("duplicate opcode " + block.opcode);
            ids.add(block.id);
            opcodes.add(block.opcode);
            if (!Array.isArray(block.inputs) || !Array.isArray(block.modes)) {
              throw new Error("bad block schema " + block.id);
            }
          }
          console.log("registry blocks=" + registry.blocks.length);
          NODE

      - name: Instantiate WASM and verify every registry opcode
        run: |
          node <<'NODE'
          const fs = require("fs");
          const registry = JSON.parse(
            fs.readFileSync("experiments/browser-accelerator/web/i386-blocks.json", "utf8")
          );
          const bytes = fs.readFileSync(
            "experiments/a-circuit/target/wasm32-unknown-unknown/release/amemory_a_circuit.wasm"
          );
          WebAssembly.instantiate(bytes, {}).then(({instance}) => {
            const w = instance.exports;
            if (w.amemory_i386_lab_probe() !== 0x386) throw new Error("bad lab probe");
            for (const block of registry.blocks) {
              if (w.amemory_i386_lab_supports(block.opcode) !== 1) {
                throw new Error("registry/WASM mismatch: " + block.id);
              }
            }

            // Real WASM execution smoke: composed structural MUX1.
            if (w.amemory_i386_lab_run(12, 1, 0, 1) !== 1) {
              throw new Error("MUX1 WASM execution rejected");
            }
            if (w.amemory_i386_lab_value() !== 0) {
              throw new Error("MUX1 WASM wrong result");
            }
            if (w.amemory_i386_lab_reactions() !== 7) {
              throw new Error("MUX1 WASM wrong reaction count");
            }
            if (w.amemory_i386_lab_quiescent() !== 1) {
              throw new Error("MUX1 WASM did not reach quiescence");
            }
            if (w.amemory_i386_lab_steady_link_delta() !== 0) {
              throw new Error("MUX1 repeated run grew Links");
            }
            if (w.amemory_i386_lab_proof_available() !== 1) {
              throw new Error("MUX1 structural proof JSON missing");
            }
            const proofLen = w.amemory_i386_lab_proof_json_len() >>> 0;
            const proofPtr = w.amemory_i386_lab_proof_json_ptr() >>> 0;
            if (!proofLen || proofPtr + proofLen > w.memory.buffer.byteLength) {
              throw new Error("MUX1 proof JSON pointer/length invalid");
            }
            const proofText = Buffer
              .from(w.memory.buffer, proofPtr, proofLen)
              .toString("utf8");
            const proof = JSON.parse(proofText);
            const memoryId = proof.load.memoryInstanceId;
            if (!memoryId || proof.execute.memoryInstanceId !== memoryId || proof.result.memoryInstanceId !== memoryId) {
              throw new Error("proof changed runtime A-memory identity");
            }
            if (proof.prepare.runtimeMemoryExists !== false) {
              throw new Error("runtime A-memory existed during PREPARE stage");
            }
            const roles = new Set(proof.prepare.semanticRoots.map((root) => root.role));
            for (const role of ["function.mux1", "function.dependency.xor2", "function.dependency.and2", "data.select", "data.a", "data.b", "execution.interpreter", "execution.theory", "invocation.call", "scope.initial"]) {
              if (!roles.has(role)) throw new Error("prepared Aset missing semantic root " + role);
            }
            if (!Array.isArray(proof.prepare.theoryAdmissions) || proof.prepare.theoryAdmissions.length === 0) {
              throw new Error("prepared Aset did not expose admitted Structural Rules");
            }
            if (!proof.load.carrierRoundTrip || proof.load.linksBeforeLoad !== 1 || proof.load.linksAfterLoad <= 1) {
              throw new Error("packed carrier load witness failed");
            }
            if (proof.load.linksAfterLoad !== proof.prepare.compiledLinks) {
              throw new Error("runtime A-memory does not contain the complete compiled Aset");
            }
            if (!proof.execute.reactions.every((step) => step.memoryInstanceId === memoryId)) {
              throw new Error("reaction trace used more than one A-memory");
            }
            if (!proof.execute.finalQuiescent || proof.execute.activeReactionCount !== 7) {
              throw new Error("MUX1 proof execution trajectory mismatch");
            }
            if (!proof.result.oracleMatches || proof.result.identicalRerunLinkDelta !== 0) {
              throw new Error("MUX1 proof result/or rerun witness failed");
            }
            if (proof.result.visualLinks.length !== proof.result.linksFinal) {
              throw new Error("visual snapshot does not contain every runtime Link");
            }
            const visualKeys = new Set(proof.result.visualLinks.map((link) => link.key));
            for (const link of proof.result.visualLinks) {
              if (!link.key.startsWith(memoryId + ":L")) throw new Error("visual Link from foreign memory");
              if (!visualKeys.has(link.startKey) || !visualKeys.has(link.endKey)) {
                throw new Error("visual topology has foreign/missing pole");
              }
            }
            const run = (op, a, b, flag, expected, label) => {
              if (w.amemory_i386_lab_run(op, a, b, flag) !== 1) {
                throw new Error(label + " WASM execution rejected");
              }
              if ((w.amemory_i386_lab_value() >>> 0) !== (expected >>> 0)) {
                throw new Error(label + " WASM wrong result");
              }
              if (w.amemory_i386_lab_quiescent() !== 1) {
                throw new Error(label + " WASM did not reach quiescence");
              }
              if (w.amemory_i386_lab_steady_link_delta() !== 0) {
                throw new Error(label + " repeated run grew Links");
              }
            };


            const readCurrentProof = (label) => {
              if (w.amemory_i386_lab_proof_available() !== 1) {
                throw new Error(label + " structural proof JSON missing");
              }
              const len = w.amemory_i386_lab_proof_json_len() >>> 0;
              const ptr = w.amemory_i386_lab_proof_json_ptr() >>> 0;
              if (!len || ptr + len > w.memory.buffer.byteLength) {
                throw new Error(label + " proof JSON pointer/length invalid");
              }
              const proof = JSON.parse(
                Buffer.from(w.memory.buffer, ptr, len).toString("utf8")
              );
              if (!Array.isArray(proof.prepare?.theoryAdmissions) ||
                  proof.prepare.theoryAdmissions.length === 0 ||
                  !proof.prepare.theoryAdmissions.every(
                    (ref) => typeof ref === "string" && /^L\d+$/.test(ref)
                  )) {
                throw new Error(label + " Theory admissions are not packed-carrier Link references");
              }
              return proof;
            };

            const verifyLogicProof = (op, a, b, expected, expectedWriteback, block) => {
              run(op, a, b, 0, expected, block);
              if ((w.amemory_i386_lab_writeback() >>> 0) !== (expectedWriteback >>> 0)) {
                throw new Error(block + " WASM writeback mismatch");
              }
              const proof = readCurrentProof(block);
              if (proof.block !== block) {
                throw new Error(block + " proof block identity mismatch");
              }

              const memoryId = proof.load.memoryInstanceId;
              if (!memoryId ||
                  proof.execute.memoryInstanceId !== memoryId ||
                  proof.result.memoryInstanceId !== memoryId) {
                throw new Error(block + " proof changed runtime A-memory identity");
              }
              if (proof.prepare.runtimeMemoryExists !== false) {
                throw new Error(block + " runtime A-memory existed during PREPARE");
              }
              if (!Array.isArray(proof.prepare.theoryAdmissions) ||
                  proof.prepare.theoryAdmissions.length === 0) {
                throw new Error(block + " proof did not expose Theory admissions");
              }
              if (!proof.load.carrierRoundTrip ||
                  proof.load.linksBeforeLoad !== 1 ||
                  proof.load.linksAfterLoad !== proof.prepare.compiledLinks) {
                throw new Error(block + " packed carrier load witness failed");
              }
              if (!proof.execute.finalQuiescent ||
                  !proof.execute.reactions.every((step) => step.memoryInstanceId === memoryId)) {
                throw new Error(block + " execution witness is not one-memory/quiescent");
              }
              if (!proof.result.oracleMatches ||
                  proof.result.identicalRerunLinkDelta !== 0 ||
                  (proof.result.decodedValue >>> 0) !== (expected >>> 0)) {
                throw new Error(block + " structural result/oracle/rerun witness failed");
              }

              const roles = new Set(
                proof.prepare.semanticRoots.map((root) => root.role)
              );
              for (const role of [
                "data.a.word",
                "data.bit.zero",
                "data.bit.one",
                "execution.interpreter",
                "execution.theory",
                "execution.apply",
                "invocation.call",
                "scope.initial",
                "result.tag",
              ]) {
                if (!roles.has(role)) {
                  throw new Error(block + " prepared Aset missing semantic root " + role);
                }
              }
              if (op === 4) {
                for (const role of ["function.effect.not", "function.word_not", "function.gate.not1"]) {
                  if (!roles.has(role)) {
                    throw new Error(block + " prepared Aset missing " + role);
                  }
                }
              } else {
                if (!roles.has("function.effect.binary") ||
                    !roles.has("function.word_binary") ||
                    !roles.has("data.b.word") ||
                    !roles.has("data.writeback") ||
                    ![...roles].some((role) => role.startsWith("function.gate."))) {
                  throw new Error(block + " prepared Aset missing binary logic structure");
                }
                const sourceByRole = new Map(
                  proof.prepare.semanticRoots.map((root) => [root.role, root.source])
                );
                const expectedBitRole =
                  expectedWriteback === 0 ? "data.bit.zero" : "data.bit.one";
                if (sourceByRole.get("data.writeback") !== sourceByRole.get(expectedBitRole)) {
                  throw new Error(block + " structural writeback bit mismatch");
                }
              }

              if (proof.result.visualLinks.length !== proof.result.linksFinal) {
                throw new Error(block + " visual snapshot does not contain every runtime Link");
              }
              const visualKeys = new Set(
                proof.result.visualLinks.map((link) => link.key)
              );
              for (const link of proof.result.visualLinks) {
                if (!link.key.startsWith(memoryId + ":L") ||
                    !visualKeys.has(link.startKey) ||
                    !visualKeys.has(link.endKey)) {
                  throw new Error(block + " visual topology has a foreign/missing Link pole");
                }
              }
            };

            verifyLogicProof(1, 0xaaaaaaaa, 0x0f0f0f0f, 0x0a0a0a0a, 1, "AND32");
            verifyLogicProof(2, 0xaaaa0000, 0x00005555, 0xaaaa5555, 1, "OR32");
            verifyLogicProof(3, 0xffff0000, 0x0f0f0f0f, 0xf0f00f0f, 1, "XOR32");
            verifyLogicProof(4, 0x12345678, 0, 0xedcba987, 1, "NOT32");
            verifyLogicProof(5, 0xf0f01234, 0x0ff0ffff, 0x00f01234, 0, "TEST32");

            const verifyArithmeticProof = (
              op, a, b, inputFlag, expected, expectedWriteback,
              expectedX, expectedMode, block
            ) => {
              run(op, a, b, inputFlag, expected, block);
              if ((w.amemory_i386_lab_writeback() >>> 0) !== (expectedWriteback >>> 0)) {
                throw new Error(block + " WASM writeback mismatch");
              }
              const proof = readCurrentProof(block);
              if (proof.block !== block) {
                throw new Error(block + " proof block identity mismatch");
              }

              const memoryId = proof.load.memoryInstanceId;
              if (!memoryId ||
                  proof.execute.memoryInstanceId !== memoryId ||
                  proof.result.memoryInstanceId !== memoryId ||
                  !proof.execute.reactions.every((step) => step.memoryInstanceId === memoryId)) {
                throw new Error(block + " proof changed runtime A-memory identity");
              }
              if (proof.prepare.runtimeMemoryExists !== false ||
                  !proof.load.carrierRoundTrip ||
                  proof.load.linksBeforeLoad !== 1 ||
                  proof.load.linksAfterLoad !== proof.prepare.compiledLinks) {
                throw new Error(block + " packed carrier witness failed");
              }
              if (!proof.execute.finalQuiescent ||
                  !proof.result.oracleMatches ||
                  proof.result.identicalRerunLinkDelta !== 0 ||
                  (proof.result.decodedValue >>> 0) !== (expected >>> 0)) {
                throw new Error(block + " arithmetic structural result witness failed");
              }

              const sourceByRole = new Map(
                proof.prepare.semanticRoots.map((root) => [root.role, root.source])
              );
              for (const role of [
                "function.effect.arithmetic",
                "function.flagged_arithmetic",
                "data.a.word",
                "data.b.word",
                "data.x",
                "data.mode",
                "data.writeback",
                "data.bit.zero",
                "data.bit.one",
                "execution.interpreter",
                "execution.theory",
                "execution.apply",
                "invocation.call",
                "scope.initial",
                "result.tag",
              ]) {
                if (!sourceByRole.has(role)) {
                  throw new Error(block + " prepared Aset missing " + role);
                }
              }
              const bitSource = (value) =>
                sourceByRole.get(value === 0 ? "data.bit.zero" : "data.bit.one");
              if (sourceByRole.get("data.x") !== bitSource(expectedX) ||
                  sourceByRole.get("data.mode") !== bitSource(expectedMode) ||
                  sourceByRole.get("data.writeback") !== bitSource(expectedWriteback)) {
                throw new Error(block + " structural X/Mode/WriteBack selector mismatch");
              }

              if (proof.result.visualLinks.length !== proof.result.linksFinal) {
                throw new Error(block + " visual snapshot does not contain every runtime Link");
              }
            };

            verifyArithmeticProof(6, 0xffffffff, 1, 0, 0, 1, 0, 0, "ADD32");
            verifyArithmeticProof(7, 0xffffffff, 0, 1, 0, 1, 1, 0, "ADC32");
            verifyArithmeticProof(8, 0, 1, 0, 0xffffffff, 1, 0, 1, "SUB32");
            verifyArithmeticProof(9, 0, 0, 1, 0xffffffff, 1, 1, 1, "SBB32");
            verifyArithmeticProof(10, 7, 9, 0, 0xfffffffe, 0, 0, 1, "CMP32");

            const verifyMux32Proof = (select, a, b, expected) => {
              run(11, a, b, select, expected, "MUX32");
              const proof = readCurrentProof("MUX32");
              if (proof.block !== "MUX32") {
                throw new Error("MUX32 proof block identity mismatch");
              }
              const memoryId = proof.load.memoryInstanceId;
              if (!memoryId ||
                  proof.execute.memoryInstanceId !== memoryId ||
                  proof.result.memoryInstanceId !== memoryId ||
                  !proof.execute.reactions.every((step) => step.memoryInstanceId === memoryId)) {
