name: A-Circuit Workbench real-WASM

# The unified Workbench is a first-class executable test surface.

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "experiments/a-circuit/**"
      - "experiments/browser-accelerator/web/**"
      - ".github/workflows/a-circuit-web-lab.yml"
      - ".github/workflows/browser-accelerator-pages.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: a-circuit-web-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add --toolchain 1.98.1 wasm32-unknown-unknown

      - name: Workbench browser acceptance
        run: node experiments/a-circuit/tests/workbench-browser-acceptance.mjs

      - name: Native web-lab structural tests
        run: |
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            packed_carrier_reconstructs_complete_shared_topology \
            -- --nocapture --test-threads=1
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            web_lab_executes_real_logic_arithmetic_and_mux_blocks \
            -- --ignored --nocapture --test-threads=1
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            web_lab_rejects_unknown_op_and_invalid_select \
            -- --nocapture --test-threads=1
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            web_mux1_proof_uses_one_runtime_memory_for_all_eight_cases \
            -- --nocapture --test-threads=1

      - name: Verify exact mts_visual proof renderer pin
        run: |
          set -euo pipefail
          commit="$(jq -r '.commit' experiments/browser-accelerator/mts-visual.lock.json)"
          package_version="$(jq -r '.packageVersion' experiments/browser-accelerator/mts-visual.lock.json)"
          test "${commit}" = "ccb23ffacb6e534690b1e88b35f3056b93929951"
          test "${package_version}" = "0.5.0"

          git clone --quiet https://github.com/netkeep80/mts_visual.git /tmp/mts_visual
          git -C /tmp/mts_visual checkout --quiet "${commit}"
          test "$(git -C /tmp/mts_visual rev-parse HEAD)" = "${commit}"
          npm --prefix /tmp/mts_visual ci --silent
          npm --prefix /tmp/mts_visual test --silent
          npm --prefix /tmp/mts_visual run build --silent
          test -s /tmp/mts_visual/dist/src/index.js
          test -s /tmp/mts_visual/dist/src/blueprint-svg.js
          test -s /tmp/mts_visual/dist/src/three/index.js
          test -s /tmp/mts_visual/dist/src/octahedral-live3d.js
          test -s /tmp/mts_visual/dist/src/octahedral-performance3d.js
          test -s /tmp/mts_visual/dist/src/three/octahedral-live-renderer.js
          test "$(node -p "require('/tmp/mts_visual/node_modules/three/package.json').version")" = "0.185.1"
          test -s /tmp/mts_visual/node_modules/three/build/three.module.js
          test -s /tmp/mts_visual/node_modules/three/examples/jsm/controls/OrbitControls.js

          npx --yes esbuild@0.24.2             /tmp/mts_visual/src/index.ts             --bundle --format=esm --platform=browser --target=es2022             --outfile=/tmp/mts-visual-core.bundle.js
          npx --yes esbuild@0.24.2             /tmp/mts_visual/src/three/index.ts             --bundle --format=esm --platform=browser --target=es2022             --outfile=/tmp/mts-visual-three.bundle.js

          test -s /tmp/mts-visual-core.bundle.js
          test -s /tmp/mts-visual-three.bundle.js
          cp /tmp/mts-visual-core.bundle.js /tmp/mts-visual-core.bundle.mjs
          cp /tmp/mts-visual-three.bundle.js /tmp/mts-visual-three.bundle.mjs
          node experiments/browser-accelerator/tests/mts-visual-bundle-smoke.mjs /tmp/mts-visual-core.bundle.mjs /tmp/mts-visual-three.bundle.mjs

          grep -F 'import("./vendor/mts-visual-core.bundle.js")' experiments/browser-accelerator/web/proof-view.mjs
          grep -F 'import("./vendor/mts-visual-three.bundle.js")' experiments/browser-accelerator/web/proof-view.mjs
          grep -F 'createOctahedralLivePhysics3D' experiments/browser-accelerator/web/proof-view.mjs
          grep -F 'createOctahedralThreeLiveRenderer' experiments/browser-accelerator/web/proof-view.mjs
          if grep -Fq 'vendor/mts-visual/three/index.js' experiments/browser-accelerator/web/proof-view.mjs; then
            echo "proof renderer still references the fragile unbundled 3D entrypoint" >&2
            exit 1
          fi

      - name: Build the real A-Circuit WASM
        env:
          CARGO_TARGET_DIR: experiments/a-circuit/target
        run: |
          cargo +1.98.1 build \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            --target wasm32-unknown-unknown

      - name: Real browser retained Worker Session E2E
        env:
          AMEMORY_SOURCE_SHA: ${{ github.sha }}
        run: node experiments/a-circuit/tests/workbench-worker-browser-e2e.mjs

      - name: Registry schema and uniqueness
        run: node experiments/a-circuit/tests/web-lab-registry.test.cjs

      - name: Instantiate WASM and verify every registry opcode
        env:
          AMEMORY_SOURCE_SHA: ${{ github.sha }}
        run: |
          node experiments/a-circuit/tests/web-lab-wasm-acceptance.test.cjs
          cat experiments/a-circuit/target/web-lab-acceptance-report.json

      - name: Build browser accelerator WASM for accepted Pages payload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CARGO_TARGET_DIR: experiments/browser-accelerator/rust/target
          RUSTFLAGS: "-C panic=abort"
        run: |
          cargo +1.98.1 build \
            --manifest-path experiments/browser-accelerator/rust/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release

      - name: Stage exact accepted browser payload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          payload="/tmp/accepted-browser-payload"
          rm -rf "${payload}"
          mkdir -p "${payload}/vendor/mts-visual" "${payload}/vendor/three/addons"

          cp experiments/a-circuit/target/wasm32-unknown-unknown/release/amemory_a_circuit.wasm \
            "${payload}/amemory_a_circuit.wasm"
          cp experiments/browser-accelerator/rust/target/wasm32-unknown-unknown/release/amemory_browser_probe.wasm \
            "${payload}/amemory_browser_probe.wasm"
          cp experiments/a-circuit/target/web-lab-acceptance-report.json \
            "${payload}/web-lab-acceptance-report.json"
          cp VERSION "${payload}/VERSION"
          cp experiments/browser-accelerator/mts-visual.lock.json "${payload}/mts-visual-lock.json"

          cp -R /tmp/mts_visual/dist/src/. "${payload}/vendor/mts-visual/"
          cp /tmp/mts_visual/node_modules/three/build/three.module.js \
            "${payload}/vendor/three/three.module.js"
          cp -R /tmp/mts_visual/node_modules/three/examples/jsm/. \
            "${payload}/vendor/three/addons/"
          cp /tmp/mts-visual-core.bundle.js "${payload}/vendor/mts-visual-core.bundle.js"
          cp /tmp/mts-visual-three.bundle.js "${payload}/vendor/mts-visual-three.bundle.js"

          jq -e --arg sha "${GITHUB_SHA}" --arg version "$(cat VERSION)" '
            .sourceSha == $sha
            and .version == $version
            and .proofCoveredOpcodes == .registryBlocks
            and .proofCoveredOpcodes >= 24
          ' "${payload}/web-lab-acceptance-report.json" >/dev/null

      - name: Upload exact accepted browser payload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: accepted-browser-lab-payload
          path: /tmp/accepted-browser-payload
          retention-days: 14
          if-no-files-found: error
