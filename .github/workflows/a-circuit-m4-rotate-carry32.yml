name: A-Circuit M4 RCL RCR

on:
  pull_request:
    paths:
      - "experiments/a-circuit/**"
      - ".github/workflows/a-circuit-m4-rotate-carry32.yml"
  push:
    branches: [main]
    paths:
      - "experiments/a-circuit/**"
      - ".github/workflows/a-circuit-m4-rotate-carry32.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate-carry32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Structural RCL/RCR suite
        run: |
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            m4_rotate_carry32_ \
            -- --ignored --nocapture --test-threads=1
      - name: 80386 carry-rotate policy
        run: |
          echo "RCL/RCR structurally rotate a 33-bit Word32+CF carrier."
          echo "Only low five Count8 bits constrain rule selection."
          echo "Only CF/OF are patched; other flags are preserved."
