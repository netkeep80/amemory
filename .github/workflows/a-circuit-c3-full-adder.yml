name: A-Circuit C3 Full Adder

on:
  pull_request:
    paths:
      - "experiments/optimized-cpu-rust/**"
      - ".github/workflows/a-circuit-c3-full-adder.yml"
  push:
    branches: [main]
    paths:
      - "experiments/optimized-cpu-rust/**"
      - ".github/workflows/a-circuit-c3-full-adder.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Run five-gate Full Adder
        run: |
          cargo +1.98.1 run \
            --quiet \
            --release \
            --manifest-path experiments/optimized-cpu-rust/Cargo.toml \
            --example c3_full_adder | tee /tmp/c3.log

          grep '^C3_RESULT_JSON=' /tmp/c3.log
          grep '^A_CIRCUIT_C3=GREEN' /tmp/c3.log

      - name: Guard reusable gate composition
        shell: bash
        run: |
          test "$(grep -c 'define_binary_gate_rows' experiments/optimized-cpu-rust/examples/c3_full_adder.rs)" -ge 4
          ! grep -q 'FULL_GLOBAL_TRUTH_TABLE' experiments/optimized-cpu-rust/src/structural.rs
          ! grep -q 'XOR' experiments/optimized-cpu-rust/src/structural.rs
          ! grep -q 'AND' experiments/optimized-cpu-rust/src/structural.rs
          ! grep -q 'OR' experiments/optimized-cpu-rust/src/structural.rs
          echo "C3_GENERIC_EXECUTOR_GUARD=PASS"
