name: A-Circuit C2b structural differential

on:
  pull_request:
    paths:
      - "experiments/a-circuit/upstream/**"
      - "experiments/optimized-cpu-rust/**"
      - ".github/workflows/a-circuit-c2b-mts.yml"
  push:
    branches: [main]
    paths:
      - "experiments/a-circuit/upstream/**"
      - "experiments/optimized-cpu-rust/**"
      - ".github/workflows/a-circuit-c2b-mts.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MTS_ACCEPTED_V013_SHA: 3819b5fb2bae65506c2888e7c4fa0de387551846

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A-memory
        uses: actions/checkout@v6

      - name: Checkout exact accepted MTS v0.13
        uses: actions/checkout@v6
        with:
          repository: netkeep80/anum_docs
          ref: ${{ env.MTS_ACCEPTED_V013_SHA }}
          path: _upstream/anum_docs

      - name: Verify exact upstream pin
        shell: bash
        run: |
          test "$(git -C _upstream/anum_docs rev-parse HEAD)" = "$MTS_ACCEPTED_V013_SHA"
          echo "MTS accepted v0.13 pin: $MTS_ACCEPTED_V013_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build accepted MTS TypeScript kernel
        working-directory: _upstream/anum_docs/ts
        run: |
          npm ci
          npm run build

      - name: Run accepted-MTS gate-composed Half Adder
        run: |
          node experiments/a-circuit/upstream/c2b-half-adder.mjs | tee /tmp/c2b-mts.log
          grep '^C2B_RESULT_JSON=' /tmp/c2b-mts.log

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Run optimized Rust gate-composed Half Adder
        run: |
          cargo +1.98.1 run \
            --quiet \
            --release \
            --manifest-path experiments/optimized-cpu-rust/Cargo.toml \
            --example c2b_half_adder | tee /tmp/c2b-rust.log
          grep '^C2B_RESULT_JSON=' /tmp/c2b-rust.log

      - name: Compare normalized portable trajectories
        shell: bash
        run: |
          MTS="$(grep '^C2B_RESULT_JSON=' /tmp/c2b-mts.log)"
          RUST="$(grep '^C2B_RESULT_JSON=' /tmp/c2b-rust.log)"
          printf 'accepted MTS: %s\n' "$MTS"
          printf 'optimized Rust: %s\n' "$RUST"
          test "$MTS" = "$RUST"
          echo "C2B_STRUCTURAL_DIFFERENTIAL=PASS"
