name: MTS foundation + A-memory profile check

on:
  pull_request:
    paths:
      - "contracts/upstream/**"
      - "contracts/amemory-contract-v*.json"
      - "contracts/amemory-conformance-v*.json"
      - "contracts/amemory-artifacts.json"
      - "scripts/sync-mts-requirements.mjs"
      - "scripts/test-mts-upstream-import.mjs"
      - "scripts/verify-amemory-artifacts.mjs"
      - ".github/workflows/mts-upstream-check.yml"
      - "repo-policy.json"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "contracts/upstream/**"
      - "contracts/amemory-contract-v*.json"
      - "contracts/amemory-conformance-v*.json"
      - "contracts/amemory-artifacts.json"
      - "scripts/sync-mts-requirements.mjs"
      - "scripts/test-mts-upstream-import.mjs"
      - "scripts/verify-amemory-artifacts.mjs"
      - ".github/workflows/mts-upstream-check.yml"
      - "repo-policy.json"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Importer + D7 declaration positive/negative tests
        run: node scripts/test-mts-upstream-import.mjs

      - name: Verify local contract/conformance artifact lifecycle
        run: node scripts/verify-amemory-artifacts.mjs

      - name: Verify exact pinned MTS foundation + execution profile projection
        run: node scripts/sync-mts-requirements.mjs --check
