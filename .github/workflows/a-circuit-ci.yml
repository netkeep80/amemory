name: A-Circuit consolidated CI

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "experiments/a-circuit/**"
      - "experiments/optimized-cpu-rust/**"
      - ".github/workflows/a-circuit-ci.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "experiments/a-circuit/**"
      - "experiments/optimized-cpu-rust/**"
      - ".github/workflows/a-circuit-ci.yml"
  workflow_dispatch:

concurrency:
  group: a-circuit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MTS_PROFILE_FOUNDATION_V013_SHA: 3819b5fb2bae65506c2888e7c4fa0de387551846

jobs:
  verify:
    name: A-Circuit complete structural suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout A-memory
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain once
        run: rustup toolchain install 1.98.1 --profile minimal


      - name: Install Rust formatting component
        run: rustup component add rustfmt --toolchain 1.98.1

      # Preserve parallel execution for the rest of the workspace; exercise
      # just the stateful scenario_web ABI tests as a serial/parallel control.
      - name: CI-UNBLOCK scenario_web isolation serial and repeated parallel regression
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.1 test -p amemory-a-circuit --lib scenario_web::tests:: -- --test-threads=1
          for attempt in 1 2 3 4 5 6; do
            cargo +1.98.1 test -p amemory-a-circuit --lib scenario_web::tests:: -- --test-threads=8
            echo "SCENARIO_WEB_PARALLEL_ISOLATION_ATTEMPT_${attempt}=PASS"
          done
          echo "SCENARIO_WEB_TEST_ISOLATION=PASS"

      - name: Checkout immutable accepted v0.15 transport producer
        uses: actions/checkout@v6
        with:
          repository: netkeep80/anum_docs
          ref: 63bd6624e0e030b26ca5a79bc676892ed1408594
          path: upstream-anum-docs
          persist-credentials: false

      - name: Node for pinned upstream source replay
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate and independently replay accepted compact AND semantic ANet
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-anum-docs rev-parse HEAD)" = "63bd6624e0e030b26ca5a79bc676892ed1408594"
          sha256sum upstream-anum-docs/formal/v0.15/regression/compact-and.formal |
            grep -q '^4a5bc92e661ee1d4e0c2c5d51769805b5406651bb491345200d088c9ad23e5f3 '
          npm ci --prefix upstream-anum-docs/ts
          npm run build --prefix upstream-anum-docs/ts
          (
            cd upstream-anum-docs/ts
            MTS_V015_SNAPSHOT_OUTPUT="$RUNNER_TEMP/a1-compact-and.json" \
              node dist/test/v015-semantic-snapshot-transport.test.js
            MTS_V015_SNAPSHOT_INPUT="$RUNNER_TEMP/a1-compact-and.json" \
              node dist/test/v015-semantic-snapshot-transport.test.js
          )
          echo "UPSTREAM_SOURCE_BACKED_REPLAY=PASS"
          MTS_V015_SNAPSHOT_INPUT="$RUNNER_TEMP/a1-compact-and.json" \
          MTS_V015_VERIFIED_EVIDENCE="$RUNNER_TEMP/a1-verified.json" \
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const s = JSON.parse(readFileSync(process.env.MTS_V015_SNAPSHOT_INPUT, 'utf8'));
          if (s.schema !== 'mts-v015-semantic-anet-transport/v0.1' ||
              s.source.bytesSha256 !== '4a5bc92e661ee1d4e0c2c5d51769805b5406651bb491345200d088c9ad23e5f3' ||
              s.source.revision !== '813a1569300b241a3b70eb282eecd8231db15e4b' ||
              s.members.length !== 4) throw Error('unexpected independently verified compact AND');
          const verified = {
            status: 'SOURCE_REPLAY_VERIFIED',
            members: s.members, topology: s.topology, source: s.source,
            contentSha256: s.contentSha256,
          };
          writeFileSync(process.env.MTS_V015_VERIFIED_EVIDENCE, JSON.stringify(verified));
          if (s.contentSha256 !== 'd332f148d42562e8585330493c78a9aa2db3f76641eb660e9804008e5276639c')
            throw Error('unexpected independently pinned compact AND semantic digest');
          const forged = JSON.parse(JSON.stringify(s));
          const available = forged.topology.links.findIndex((_, i) => i > 0 && !forged.members.includes(i));
          if (available < 0) throw Error('no physical nonmember to attack');
          forged.members.push(available);
          forged.members.sort((a,b) => a - b);
          forged.contentSha256 = createHash('sha256').update(JSON.stringify({
            schema: forged.schema, topology: forged.topology,
            members: forged.members, source: forged.source,
          })).digest('hex');
          writeFileSync(process.env.MTS_V015_SNAPSHOT_INPUT + '.forged', JSON.stringify(forged));
          appendFileSync(process.env.GITHUB_ENV,
            'MTS_V015_SNAPSHOT_INPUT=' + process.env.MTS_V015_SNAPSHOT_INPUT + '\n' +
            'MTS_V015_VERIFIED_EVIDENCE=' + process.env.MTS_V015_VERIFIED_EVIDENCE + '\n' +
            'MTS_V015_EXPECTED_DIGEST=' + s.contentSha256 + '\n' +
            'MTS_V015_TAMPERED_SNAPSHOT_INPUT=' + process.env.MTS_V015_SNAPSHOT_INPUT + '.forged' + '\n');
          NODE

      - name: A1-1a exact source-backed Rust CPU load + P1-P5 N1-N8
        run: |
          set -euo pipefail
          rustfmt +1.98.1 --edition 2021 --check experiments/optimized-cpu-rust/src/semantic_anet_loader.rs
          cargo +1.98.1 test --workspace --locked
          cargo +1.98.1 test --release --locked \
            -p amemory-optimized-cpu-probe a1_real_upstream_p1_p5_n1_n8 \
            -- --ignored --nocapture
          git diff --check origin/main...HEAD
          git diff --check
          git diff --exit-code -- experiments/optimized-cpu-rust/src/semantic_anet_loader.rs
          echo "A1_COMPONENT_RUST_LOADER_P1_P5_N1_N8=PASS"

      - name: Verify exact LinksDB Doublets provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import tomllib

          pin = json.loads(
              pathlib.Path("experiments/a-circuit/linksdb-doublets.lock.json")
              .read_text(encoding="utf-8")
          )
          expected_commit = "1d54fd692960258b9b72380e67e2c4f6369372bf"
          expected_tag_object = "98bcaad1490beed1a6c583bc58ba864bebf009f3"
          assert pin["schemaVersion"] == 1, pin
          assert pin["commit"] == expected_commit, pin
          assert pin["tag"] == "v0.5.0", pin
          assert pin["tagObjectSha"] == expected_tag_object, pin
          assert pin["crate"] == "doublets", pin
          assert pin["crateVersion"] == "0.5.0", pin
          assert pin["amemoryRustToolchain"] == "1.98.1", pin

          cargo = tomllib.loads(
              pathlib.Path("experiments/a-circuit/Cargo.toml")
              .read_text(encoding="utf-8")
          )
          target = cargo["target"]['cfg(not(target_family = "wasm"))']
          dep = target["dependencies"]["doublets"]
          assert dep["git"] == "https://github.com/linksplatform/doublets-rs", dep
          assert dep["rev"] == expected_commit, dep
          assert dep["version"] == "=0.5.0", dep

          lock = pathlib.Path("Cargo.lock").read_text(encoding="utf-8")
          expected_source = (
              "git+https://github.com/linksplatform/doublets-rs"
              f"?rev={expected_commit}#{expected_commit}"
          )
          assert 'name = "doublets"' in lock
          assert 'version = "0.5.0"' in lock
          assert f'source = "{expected_source}"' in lock
          print("LINKSDB_DOUBLETS_PROVENANCE=PASS")
          PY

      - name: LinksDB Doublets physical-store falsifiers
        run: |
          set -euo pipefail
          cargo +1.98.1 test \
            --locked \
            --manifest-path experiments/a-circuit/Cargo.toml \
            linksdb_doublets_ \
            -- --nocapture --test-threads=1
          echo "LINKSDB_DOUBLETS_L1=PASS"

      - name: Workspace dependency direction and locked graph
        run: |
          set -euo pipefail
          cargo +1.98.1 metadata --locked --format-version 1 --no-deps > /tmp/workspace-metadata.json
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/workspace-metadata.json", "r", encoding="utf-8"))
          packages = {p["name"]: p for p in data["packages"]}
          expected = {"amemory-browser-probe", "amemory-optimized-cpu-probe", "amemory-a-circuit"}
          assert expected.issubset(packages), packages.keys()
          for owner in ("amemory-optimized-cpu-probe", "amemory-a-circuit"):
              deps = {d["name"]: d.get("kind") for d in packages[owner]["dependencies"]}
              assert deps.get("amemory-browser-probe") == "dev", (owner, deps)
          print("WORKSPACE_DEPENDENCY_DIRECTION=PASS")
          PY
          cargo +1.98.1 test --workspace --locked --no-run
          git diff --exit-code -- Cargo.lock

      - name: C0-C1 semantic witnesses
        run: |
          cargo +1.98.1 test \
            --manifest-path experiments/a-circuit/Cargo.toml \
            -- --test-threads=1
          cargo +1.98.1 build \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml

      - name: M1 structural MUX
        run: |
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            m1_mux1_ \
            -- --nocapture --test-threads=1
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            m1_mux32_ \
            -- --ignored --nocapture --test-threads=1

      - name: M3 SUB1 shared-adder witness
        run: |
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            m3_sub1_ \
            -- --nocapture --test-threads=1

      - name: M3 generated ripple suites
        run: |
          cargo +1.98.1 test --release --manifest-path experiments/a-circuit/Cargo.toml m3_scale_ -- --ignored --nocapture --test-threads=1
          cargo +1.98.1 test --release --manifest-path experiments/a-circuit/Cargo.toml m3_sub_scale_ -- --ignored --nocapture --test-threads=1
          cargo +1.98.1 test --release --manifest-path experiments/a-circuit/Cargo.toml m3_arith_shared_ -- --ignored --nocapture --test-threads=1
          cargo +1.98.1 test --release --manifest-path experiments/a-circuit/Cargo.toml m3_eflags_ -- --ignored --nocapture --test-threads=1

      - name: M4 logic and arithmetic effects
        run: |
          cargo +1.98.1 test --release --manifest-path experiments/a-circuit/Cargo.toml m4_logic_ -- --ignored --nocapture --test-threads=1
          cargo +1.98.1 test --release --manifest-path experiments/a-circuit/Cargo.toml m4_logic_effects_ -- --ignored --nocapture --test-threads=1
          cargo +1.98.1 test --release --manifest-path experiments/a-circuit/Cargo.toml m4_arith_effect_ -- --ignored --nocapture --test-threads=1

      - name: M4 shifts and rotates
        run: |
          cargo +1.98.1 test --release --manifest-path experiments/a-circuit/Cargo.toml m4_shift1_ -- --ignored --nocapture --test-threads=1
          cargo +1.98.1 test --release --manifest-path experiments/a-circuit/Cargo.toml m4_shift32_ -- --ignored --nocapture --test-threads=1
          cargo +1.98.1 test --release --manifest-path experiments/a-circuit/Cargo.toml m4_rotate32_ -- --ignored --nocapture --test-threads=1
          cargo +1.98.1 test --release --manifest-path experiments/a-circuit/Cargo.toml m4_rotate_carry32_ -- --ignored --nocapture --test-threads=1

      - name: M4 unary and Wide64
        run: |
          cargo +1.98.1 test --release --manifest-path experiments/a-circuit/Cargo.toml m4_unary_arith_ -- --ignored --nocapture --test-threads=1
          cargo +1.98.1 test --release --manifest-path experiments/a-circuit/Cargo.toml m4_wide64_add64_ -- --ignored --nocapture --test-threads=1

      - name: M4 structural multiplication
        run: |
          cargo +1.98.1 test --release --manifest-path experiments/a-circuit/Cargo.toml m4_mul32_ -- --ignored --nocapture --test-threads=1
          cargo +1.98.1 test --release --manifest-path experiments/a-circuit/Cargo.toml m4_mul_effect_ -- --ignored --nocapture --test-threads=1

      - name: Optimized CPU differential witnesses
        run: |
          cargo +1.98.1 test \
            --manifest-path experiments/optimized-cpu-rust/Cargo.toml \
            -- --test-threads=1

      - name: Optimized CPU release rollback/conformance witnesses
        run: |
          set -euo pipefail
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/optimized-cpu-rust/Cargo.toml \
            -- --nocapture --test-threads=1 2>&1 | tee /tmp/optimized-cpu-release.log
          grep -q 'OPTIMIZED_ROLLBACK_RELEASE_DEBUG_ASSERTIONS=OFF' \
            /tmp/optimized-cpu-release.log

      - name: Optimized Rust C3 Full Adder
        run: |
          cargo +1.98.1 run \
            --quiet \
            --release \
            --manifest-path experiments/optimized-cpu-rust/Cargo.toml \
            --example c3_full_adder | tee /tmp/c3.log
          grep '^C3_RESULT_JSON=' /tmp/c3.log
          grep '^A_CIRCUIT_C3=GREEN' /tmp/c3.log
          test "$(grep -c 'define_binary_gate_rows' experiments/optimized-cpu-rust/examples/c3_full_adder.rs)" -ge 4
          ! grep -q 'FULL_GLOBAL_TRUTH_TABLE' experiments/optimized-cpu-rust/src/structural.rs
          ! grep -q 'XOR' experiments/optimized-cpu-rust/src/structural.rs
          ! grep -q 'AND' experiments/optimized-cpu-rust/src/structural.rs
          ! grep -q 'OR' experiments/optimized-cpu-rust/src/structural.rs

      - name: Checkout exact execution-profile foundation v0.13 reference once
        uses: actions/checkout@v6
        with:
          repository: netkeep80/anum_docs
          ref: ${{ env.MTS_PROFILE_FOUNDATION_V013_SHA }}
          path: _upstream/anum_docs

      - name: Verify exact upstream pin
        shell: bash
        run: |
          test "$(git -C _upstream/anum_docs rev-parse HEAD)" = "$MTS_PROFILE_FOUNDATION_V013_SHA"

      - name: Set up Node 24 once
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build pinned v0.13 execution-profile reference kernel once
        working-directory: _upstream/anum_docs/ts
        run: |
          npm ci
          npm run build

      - name: C2b v0.13 profile-reference / optimized-Rust differential
        shell: bash
        run: |
          node experiments/a-circuit/upstream/c2b-half-adder.mjs | tee /tmp/c2b-mts.log
          cargo +1.98.1 run \
            --quiet \
            --release \
            --manifest-path experiments/optimized-cpu-rust/Cargo.toml \
            --example c2b_half_adder | tee /tmp/c2b-rust.log
          MTS="$(grep '^C2B_RESULT_JSON=' /tmp/c2b-mts.log)"
          RUST="$(grep '^C2B_RESULT_JSON=' /tmp/c2b-rust.log)"
          test "$MTS" = "$RUST"
          echo "C2B_STRUCTURAL_DIFFERENTIAL=PASS"

      - name: M2 v0.13 profile-reference / A-memory Full Adder differential
        shell: bash
        run: |
          node experiments/a-circuit/upstream/m2-full-adder.mjs 2>&1 | tee /tmp/full-adder-upstream.log
          grep -q "A_CIRCUIT_M2_FULL_ADDER=GREEN" /tmp/full-adder-upstream.log

          cargo +1.98.1 test \
            --manifest-path experiments/a-circuit/Cargo.toml \
            m2_gate_composed_full_adder_all_eight_rows \
            -- --nocapture --test-threads=1 2>&1 | tee /tmp/full-adder-rust.log

          sed -n 's/.*FULL_ADDER_TRACE input=\([01][01][01]\) sum=\([01]\) cout=\([01]\).*/\1:\2\3/p' \
            /tmp/full-adder-upstream.log | sort -u > /tmp/upstream.rows
          sed -n 's/.*FULL_ADDER_TRACE input=\([01][01][01]\) sum=\([01]\) cout=\([01]\).*/\1:\2\3/p' \
            /tmp/full-adder-rust.log | sort -u > /tmp/rust.rows

          test "$(wc -l < /tmp/upstream.rows)" -eq 8
          test "$(wc -l < /tmp/rust.rows)" -eq 8
          diff -u /tmp/upstream.rows /tmp/rust.rows

          cat > /tmp/expected.rows <<'EOF'
          000:00
          001:10
          010:10
          011:01
          100:10
          101:01
          110:01
          111:11
          EOF
          sed -i 's/^          //' /tmp/expected.rows
          diff -u /tmp/expected.rows /tmp/rust.rows
          echo "FULL_ADDER_DIFFERENTIAL=PASS"

      - name: Consolidation policy
        run: |
          bash -n scripts/ci-scale-performance.sh
          echo "All A-Circuit structural suites share one runner, checkout and Rust toolchain."
          echo "Pinned v0.13 execution-profile foundation reference is checked out and built once for both upstream differential witnesses."
          echo "Semantic and differential failures remain blocking."
          echo "Informational scale/performance evidence is owned by the scheduled/manual scale workflow."
          echo "Optimized CPU differential/build checks share this same runner."
