name: TEMP LinksDB L1 lock bootstrap

on:
  push:
    branches:
      - issue-280-linksdb-doublets-l1

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Materialize workspace lock for exact Doublets pin
        run: cargo +1.98.1 generate-lockfile

      - name: Commit generated lock when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: materialize LinksDB L1 Cargo lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
