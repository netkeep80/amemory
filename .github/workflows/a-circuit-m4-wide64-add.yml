name: A-Circuit M4 Wide64 ADD64

on:
  pull_request:
    paths:
      - "experiments/a-circuit/**"
      - ".github/workflows/a-circuit-m4-wide64-add.yml"
  push:
    branches: [main]
    paths:
      - "experiments/a-circuit/**"
      - ".github/workflows/a-circuit-m4-wide64-add.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wide64-add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Structural Wide64 ADD64 suite
        run: |
          cargo +1.98.1 test \
            --release \
            --manifest-path experiments/a-circuit/Cargo.toml \
            m4_wide64_add64_ \
            -- --ignored --nocapture --test-threads=1
      - name: Wide64 architecture policy
        run: |
          echo "Wide64 is [LoWord32,HiWord32]."
          echo "ADD64 reuses ARITH32 twice; low carry structurally feeds high ADC."
          echo "Host code is verification-only and does not propagate runtime carry."
