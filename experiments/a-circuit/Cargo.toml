[package]
name = "amemory-a-circuit"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
amemory-optimized-cpu-probe = { path = "../optimized-cpu-rust" }
serde = { workspace = true, features = ["derive"] }
