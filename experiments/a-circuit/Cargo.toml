[package]
name = "amemory-a-circuit"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
amemory-optimized-cpu-probe = { path = "../optimized-cpu-rust" }
amemory-browser-probe = { path = "../browser-accelerator/rust" }

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
